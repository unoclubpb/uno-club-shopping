<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <!-- APP VERSION: 1.0.11 -->
  <meta name="app-version" content="1.0.11">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Uno Shopping">

  <title>Uno Club Shopping</title>

  <link
    rel="icon"
    type="image/png"
    href="uno-club-shopping.PNG?v=1.0.11"
  >

  <link
    rel="apple-touch-icon"
    href="uno-club-shopping.PNG?v=1.0.11"
  >

  <style>
    :root {
      --black: #0b0b0b;
      --page: #f5f6f8;
      --white: #ffffff;
      --blue: #1e5acb;
      --blue-dark: #15459f;
      --border: #d9d9d9;
      --text: #171717;
      --muted: #6b7280;
      --danger: #c62828;
      --shadow: 0 8px 24px rgba(0,0,0,.10);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    /* HEADER */

    .app-header {
      height: calc(82px + env(safe-area-inset-top));

      padding:
        calc(9px + env(safe-area-inset-top))
        14px
        9px;

      background: var(--black);
      color: var(--white);

      display: flex;
      align-items: center;
      gap: 10px;

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      width: 100%;

      z-index: 1000;

      box-shadow:
        0 2px 10px rgba(0,0,0,.22);
    }

    .app-header h1 {
      flex: 1;

      margin: 0;

      text-align: center;
      white-space: nowrap;

      font-size: 22px;
      line-height: 1.1;
      font-weight: 850;
    }

    .header-logo {
      width: 58px;
      height: 58px;

      flex: 0 0 58px;

      object-fit: cover;

      border-radius: 12px;

      box-shadow:
        0 0 0 1px rgba(255,255,255,.14),
        0 4px 12px rgba(0,0,0,.35);
    }

    .back-button {
      width: 44px;
      height: 44px;

      flex: 0 0 44px;

      border: 0;
      border-radius: 12px;

      background: transparent;
      color: var(--white);

      font-size: 32px;
      line-height: 1;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-button[hidden] {
      display: none !important;
    }

    .back-button:active {
      background: rgba(255,255,255,.12);
    }

    main {
      width: min(100%, 620px);

      margin: 0 auto;

      padding:
        calc(104px + env(safe-area-inset-top))
        16px
        calc(42px + env(safe-area-inset-bottom));
    }

    .screen[hidden] {
      display: none !important;
    }

    /* MAIN BUTTONS */

    .button-stack {
      display: grid;
      gap: 13px;
    }

    .main-button,
    .save-button {
      width: 100%;

      min-height: 62px;

      border: 2px solid var(--black);
      border-radius: 14px;

      background: var(--blue);
      color: var(--white);

      font-size: 20px;
      font-weight: 800;

      box-shadow:
        0 5px 14px rgba(30,90,203,.24);

      cursor: pointer;

      transition:
        transform .08s ease,
        background .15s ease;
    }

    .main-button:active,
    .save-button:active {
      transform: scale(.985);
      background: var(--blue-dark);
    }

    .main-button.add-item {
      background: var(--black);

      box-shadow:
        0 5px 14px rgba(0,0,0,.20);
    }

    .store-button {
      position: relative;
    }

    .count-badge {
      position: absolute;

      top: 7px;
      right: 8px;

      min-width: 29px;
      height: 29px;

      padding: 0 7px;

      border-radius: 15px;

      background: var(--white);
      color: var(--blue);

      border: 2px solid var(--black);

      font-size: 15px;
      font-weight: 900;
      line-height: 25px;
      text-align: center;

      box-shadow:
        0 2px 5px rgba(0,0,0,.18);

      pointer-events: none;
    }

    .store-add-button {
      margin-bottom: 13px;

      background: var(--black);
    }

    /* VERSION NUMBER */

    .version-label {
      position: fixed;

      left: 10px;

      bottom:
        calc(7px + env(safe-area-inset-bottom));

      color: #000000;

      font-size: 11px;
      font-weight: 500;

      z-index: 10;

      pointer-events: none;
    }

    /* CARDS */

    .card {
      background: var(--white);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .form-card {
      padding: 18px;
    }

    /* FORM */

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      font-size: 15px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;

      min-height: 54px;

      padding: 12px 13px;

      border: 1.5px solid var(--border);
      border-radius: 12px;

      background: var(--white);
      color: var(--text);

      font-size: 18px;

      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--blue);

      box-shadow:
        0 0 0 3px rgba(30,90,203,.12);
    }

    .field select:disabled {
      opacity: 1;

      background: #eeeeee;

      color: #4b5563;

      -webkit-text-fill-color: #4b5563;

      border-color: #b8b8b8;
    }

    .locked-note {
      margin-top: 7px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 650;
    }

    .locked-note[hidden] {
      display: none !important;
    }

    /* QUANTITY */

    .qty-control {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 5px;
    }

    .qty-step-button {
      width: 36px;
      height: 44px;

      flex: 0 0 36px;

      border: 2px solid var(--black);
      border-radius: 10px;

      background: var(--white);
      color: var(--black);

      font-size: 24px;
      font-weight: 900;
      line-height: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    .qty-step-button:active {
      background: #e7e7e7;
    }

    .qty-step-button:disabled {
      opacity: .35;
    }

    .qty-input {
      width: 48px;

      min-height: 44px;

      padding: 4px;

      border: 1.5px solid var(--border);
      border-radius: 10px;

      background: var(--white);
      color: var(--text);

      text-align: center;

      font-size: 18px;
      font-weight: 800;

      outline: none;

      -moz-appearance: textfield;
    }

    .qty-input::-webkit-outer-spin-button,
    .qty-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .qty-input:focus {
      border-color: var(--blue);

      box-shadow:
        0 0 0 3px rgba(30,90,203,.12);
    }

    .add-qty-control {
      justify-content: flex-start;
    }

    .add-qty-control .qty-step-button {
      width: 48px;
      height: 52px;

      flex: 0 0 48px;
    }

    .add-qty-control .qty-input {
      width: 76px;

      min-height: 52px;

      font-size: 20px;
    }

    /* STORE LIST */

    .list-card {
      padding: 0;
    }

    .list-heading {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        132px
        48px;

      gap: 8px;

      padding: 12px 14px;

      background: #edf3ff;

      border-bottom:
        1px solid var(--border);

      color: #364152;

      font-size: 12px;
      font-weight: 900;

      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .list-heading span:nth-child(2) {
      text-align: center;
    }

    .item-row {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        132px
        48px;

      gap: 8px;

      align-items: center;

      min-height: 66px;

      padding: 9px 14px;

      border-bottom:
        1px solid #ececec;
    }

    .item-row:last-child {
      border-bottom: 0;
    }

    .item-name {
      min-width: 0;

      font-size: 17px;
      font-weight: 750;

      overflow-wrap: anywhere;
    }

    .qty-fixed {
      width: 48px;

      min-height: 44px;

      margin: 0 auto;

      border:
        1.5px solid var(--border);

      border-radius: 10px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #f1f3f6;

      color: #515865;

      font-size: 18px;
      font-weight: 800;
    }

    .delete-button {
      width: 44px;
      height: 44px;

      border: 2px solid var(--black);
      border-radius: 11px;

      background: #fff1f1;
      color: var(--danger);

      font-size: 28px;
      line-height: 1;
      font-weight: 700;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-button:active {
      background: #ffdede;
    }

    .delete-button:disabled {
      opacity: .45;
    }

    .permanent-row {
      background: #f7faff;
    }

    .fixed-note {
      color: var(--blue);

      font-size: 11px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: .5px;

      margin-top: 3px;
    }

    .empty-state,
    .loading-state,
    .error-state {
      padding: 28px 18px;

      text-align: center;

      color: var(--muted);

      font-size: 16px;
    }

    .error-state {
      color: var(--danger);
    }

    /* TOAST */

    .toast {
      position: fixed;

      left: 50%;

      bottom:
        calc(20px + env(safe-area-inset-bottom));

      transform:
        translate(-50%, 18px);

      width:
        min(calc(100% - 32px), 520px);

      padding: 13px 16px;

      border-radius: 12px;

      background: var(--black);
      color: var(--white);

      text-align: center;
      font-weight: 700;

      box-shadow:
        0 8px 30px rgba(0,0,0,.26);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .18s ease,
        transform .18s ease;

      z-index: 2000;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    .toast.error {
      background: #8f1d1d;
    }

    @media (max-width: 390px) {

      .app-header h1 {
        font-size: 20px;
      }

      .list-heading,
      .item-row {
        grid-template-columns:
          minmax(0, 1fr)
          124px
          44px;

        gap: 5px;

        padding-left: 10px;
        padding-right: 10px;
      }

      .qty-step-button {
        width: 34px;

        flex-basis: 34px;
      }

      .qty-input {
        width: 44px;
      }
    }
  </style>
</head>

<body>

<header class="app-header">

  <button
    id="backButton"
    class="back-button"
    type="button"
    aria-label="Back"
    hidden
  >
    &larr;
  </button>

  <h1 id="pageTitle">
    Uno Club Shopping
  </h1>

  <img
    class="header-logo"
    src="uno-club-shopping.PNG?v=1.0.11"
    alt="Uno Club Shopping logo"
  >

</header>


<main>

  <!-- MAIN PAGE -->

  <section
    id="homeScreen"
    class="screen"
  >

    <div class="button-stack">

      <button
        id="addItemButton"
        class="main-button add-item"
        type="button"
      >
        Add Item
      </button>

      <button
        class="main-button store-button"
        type="button"
        data-store="sams_costco"
      >
        Sam’s / CostCo

        <span
          class="count-badge"
          data-count-store="sams_costco"
        >
          1
        </span>
      </button>

      <button
        class="main-button store-button"
        type="button"
        data-store="walmart"
      >
        Walmart

        <span
          class="count-badge"
          data-count-store="walmart"
        >
          0
        </span>
      </button>

      <button
        class="main-button store-button"
        type="button"
        data-store="alcohol"
      >
        Alcohol

        <span
          class="count-badge"
          data-count-store="alcohol"
        >
          0
        </span>
      </button>

      <button
        class="main-button store-button"
        type="button"
        data-store="sodas"
      >
        Sodas

        <span
          class="count-badge"
          data-count-store="sodas"
        >
          0
        </span>
      </button>

    </div>

    <div class="version-label">
      v1.0.11
    </div>

  </section>


  <!-- ADD ITEM PAGE -->

  <section
    id="addScreen"
    class="screen"
    hidden
  >

    <div class="card form-card">

      <form id="addItemForm">

        <div class="field">

          <label for="itemName">
            What item would you like to add?
          </label>

          <input
            id="itemName"
            type="text"
            maxlength="100"
            autocomplete="off"
            required
          >

        </div>


        <div class="field">

          <label>
            Quantity
          </label>

          <div class="qty-control add-qty-control">

            <button
              id="addQtyMinus"
              class="qty-step-button"
              type="button"
              aria-label="Decrease quantity"
            >
              −
            </button>

            <input
              id="quantity"
              class="qty-input"
              type="number"
              min="1"
              max="9999"
              step="1"
              inputmode="numeric"
              value="1"
              aria-label="Quantity"
            >

            <button
              id="addQtyPlus"
              class="qty-step-button"
              type="button"
              aria-label="Increase quantity"
            >
              +
            </button>

          </div>

        </div>


        <div class="field">

          <label for="store">
            Store
          </label>

          <select
            id="store"
            required
          >

            <option
              value=""
              selected
              disabled
            >
              Choose a store
            </option>

            <option value="sams_costco">
              Sam’s / CostCo
            </option>

            <option value="walmart">
              Walmart
            </option>

            <option value="alcohol">
              Alcohol
            </option>

            <option value="sodas">
              Sodas
            </option>

          </select>

          <div
            id="lockedStoreNote"
            class="locked-note"
            hidden
          >
            This item will be added to this store.
          </div>

        </div>


        <button
          id="saveItemButton"
          class="save-button"
          type="submit"
        >
          Add Item
        </button>

      </form>

    </div>

  </section>


  <!-- STORE PAGE -->

  <section
    id="storeScreen"
    class="screen"
    hidden
  >

    <button
      id="storeAddItemButton"
      class="main-button store-add-button"
      type="button"
    >
      Add Item
    </button>

    <div class="card list-card">

      <div
        class="list-heading"
        aria-hidden="true"
      >

        <span>Item</span>

        <span>Qty</span>

        <span></span>

      </div>

      <div
        id="storeList"
        aria-live="polite"
      ></div>

    </div>

  </section>

</main>


<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
></div>


<script>

'use strict';


const APP_VERSION =
  '1.0.11';


console.info(
  `Uno Club Shopping v${APP_VERSION}`
);


const SUPABASE_URL =
  'https://yfchkrnuxaquqzxtcynp.supabase.co';


const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_gh0acghIDuQDgh24ZIm8Mw_c1bpvIM6';


const STORES = {

  sams_costco:
    'Sam’s / CostCo',

  walmart:
    'Walmart',

  alcohol:
    'Alcohol',

  sodas:
    'Sodas'

};


const LAST_STORE_KEY =
  'unoClubShoppingLastStore';


let currentStore =
  null;


let lockedAddStore =
  null;


let toastTimer =
  null;



/* ELEMENTS */

const homeScreen =
  document.getElementById(
    'homeScreen'
  );


const addScreen =
  document.getElementById(
    'addScreen'
  );


const storeScreen =
  document.getElementById(
    'storeScreen'
  );


const pageTitle =
  document.getElementById(
    'pageTitle'
  );


const backButton =
  document.getElementById(
    'backButton'
  );


const addItemButton =
  document.getElementById(
    'addItemButton'
  );


const storeAddItemButton =
  document.getElementById(
    'storeAddItemButton'
  );


const addItemForm =
  document.getElementById(
    'addItemForm'
  );


const itemNameInput =
  document.getElementById(
    'itemName'
  );


const quantityInput =
  document.getElementById(
    'quantity'
  );


const addQtyMinus =
  document.getElementById(
    'addQtyMinus'
  );


const addQtyPlus =
  document.getElementById(
    'addQtyPlus'
  );


const storeSelect =
  document.getElementById(
    'store'
  );


const lockedStoreNote =
  document.getElementById(
    'lockedStoreNote'
  );


const saveItemButton =
  document.getElementById(
    'saveItemButton'
  );


const storeList =
  document.getElementById(
    'storeList'
  );


const toast =
  document.getElementById(
    'toast'
  );



/* LAST STORE */

function rememberLastStore(
  store
) {

  if (
    !STORES[
      store
    ]
  ) {

    return;

  }


  try {

    localStorage.setItem(
      LAST_STORE_KEY,
      store
    );

  } catch (_) {}

}


function getLastStore() {

  try {

    const store =
      localStorage.getItem(
        LAST_STORE_KEY
      );


    if (
      store &&
      STORES[
        store
      ]
    ) {

      return store;

    }

  } catch (_) {}


  return null;

}



/* TOAST */

function showToast(
  message,
  isError = false
) {

  clearTimeout(
    toastTimer
  );


  toast.textContent =
    message;


  toast.classList.toggle(
    'error',
    isError
  );


  toast.classList.add(
    'show'
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          'show'
        );

      },
      2800
    );

}



/* API */

async function api(
  path,
  options = {}
) {

  const headers = {

    apikey:
      SUPABASE_PUBLISHABLE_KEY,

    Accept:
      'application/json',

    ...(options.body
      ? {
          'Content-Type':
            'application/json'
        }
      : {}),

    ...(options.headers || {})

  };


  const response =
    await fetch(
      SUPABASE_URL + path,
      {
        ...options,
        headers
      }
    );


  if (
    !response.ok
  ) {

    let message =
      `Request failed (${response.status})`;


    try {

      const data =
        await response.json();


      message =
        data.message ||
        data.error_description ||
        data.hint ||
        message;


    } catch (_) {

      const text =
        await response.text();


      if (text) {

        message =
          text;

      }

    }


    throw new Error(
      message
    );

  }


  if (
    response.status ===
    204
  ) {

    return null;

  }


  const text =
    await response.text();


  return text
    ? JSON.parse(text)
    : null;

}



/* HOME COUNTS */

async function loadHomeCounts() {

  const counts = {

    sams_costco:
      1,

    walmart:
      0,

    alcohol:
      0,

    sodas:
      0

  };


  try {

    const data =
      await api(
        '/rest/v1/shopping_items?select=store'
      );


    if (
      Array.isArray(
        data
      )
    ) {

      data.forEach(
        item => {

          if (
            Object.prototype
              .hasOwnProperty
              .call(
                counts,
                item.store
              )
          ) {

            counts[
              item.store
            ]++;

          }

        }
      );

    }


    document
      .querySelectorAll(
        '.count-badge'
      )
      .forEach(
        badge => {

          const store =
            badge.dataset
              .countStore;


          badge.textContent =
            counts[
              store
            ] ?? 0;

        }
      );


  } catch (
    error
  ) {

    console.error(
      error
    );

  }

}



/* NAVIGATION */

function showOnly(
  screen
) {

  homeScreen.hidden =
    screen !==
    homeScreen;


  addScreen.hidden =
    screen !==
    addScreen;


  storeScreen.hidden =
    screen !==
    storeScreen;

}


function goHome() {

  location.hash =
    '#home';

}


function goAdd() {

  location.hash =
    '#add';

}


function goAddForStore(
  store
) {

  location.hash =
    '#add/' +
    store;

}


function goStore(
  store
) {

  location.hash =
    '#store/' +
    store;

}



/* ROUTER */

function route() {

  const hash =
    location.hash ||
    '#home';


  /* ADD ITEM FROM A STORE */

  if (
    hash.startsWith(
      '#add/'
    )
  ) {

    const store =
      hash.slice(
        '#add/'.length
      );


    if (
      !STORES[
        store
      ]
    ) {

      goHome();

      return;

    }


    lockedAddStore =
      store;


    currentStore =
      null;


    showOnly(
      addScreen
    );


    pageTitle.textContent =
      'Add Item';


    backButton.hidden =
      false;


    storeSelect.value =
      store;


    storeSelect.disabled =
      true;


    lockedStoreNote.hidden =
      false;


    setAddQuantity(
      1
    );


    setTimeout(
      () => {

        itemNameInput.focus();

      },
      80
    );


    return;

  }


  /* NORMAL ADD ITEM FROM MAIN PAGE */

  if (
    hash ===
    '#add'
  ) {

    lockedAddStore =
      null;


    currentStore =
      null;


    showOnly(
      addScreen
    );


    pageTitle.textContent =
      'Add Item';


    backButton.hidden =
      false;


    storeSelect.disabled =
      false;


    lockedStoreNote.hidden =
      true;


    const lastStore =
      getLastStore();


    if (
      lastStore
    ) {

      storeSelect.value =
        lastStore;

    } else {

      storeSelect.value =
        '';

    }


    setAddQuantity(
      1
    );


    setTimeout(
      () => {

        itemNameInput.focus();

      },
      80
    );


    return;

  }


  /* STORE PAGE */

  if (
    hash.startsWith(
      '#store/'
    )
  ) {

    const store =
      hash.slice(
        '#store/'.length
      );


    if (
      !STORES[
        store
      ]
    ) {

      goHome();

      return;

    }


    lockedAddStore =
      null;


    currentStore =
      store;


    showOnly(
      storeScreen
    );


    pageTitle.textContent =
      STORES[
        store
      ];


    backButton.hidden =
      false;


    loadStoreItems();


    return;

  }


  /* MAIN PAGE */

  lockedAddStore =
    null;


  currentStore =
    null;


  storeSelect.disabled =
    false;


  lockedStoreNote.hidden =
    true;


  showOnly(
    homeScreen
  );


  pageTitle.textContent =
    'Uno Club Shopping';


  backButton.hidden =
    true;


  loadHomeCounts();

}



/* BACK BUTTON */

backButton
  .addEventListener(
    'click',
    () => {

      const hash =
        location.hash;


      if (
        hash.startsWith(
          '#add/'
        )
      ) {

        const store =
          hash.slice(
            '#add/'.length
          );


        if (
          STORES[
            store
          ]
        ) {

          goStore(
            store
          );

          return;

        }

      }


      goHome();

    }
  );



/* HOME ADD ITEM */

addItemButton
  .addEventListener(
    'click',
    () => {

      goAdd();

    }
  );



/* STORE BUTTONS */

document
  .querySelectorAll(
    '.store-button'
  )
  .forEach(
    button => {

      button.addEventListener(
        'click',
        () => {

          goStore(
            button.dataset
              .store
          );

        }
      );

    }
  );



/* ADD ITEM FROM STORE PAGE */

storeAddItemButton
  .addEventListener(
    'click',
    () => {

      if (
        currentStore &&
        STORES[
          currentStore
        ]
      ) {

        goAddForStore(
          currentStore
        );

      }

    }
  );



/* REMEMBER STORE */

storeSelect
  .addEventListener(
    'change',
    () => {

      if (
        !lockedAddStore
      ) {

        rememberLastStore(
          storeSelect.value
        );

      }

    }
  );



/* CLEAN ITEM NAME */

function normalizeItemName(
  value
) {

  return value
    .trim()
    .replace(
      /\s+/g,
      ' '
    );

}



/* ADD QUANTITY */

function getAddQuantity() {

  const value =
    Number.parseInt(
      quantityInput.value,
      10
    );


  if (
    !Number.isInteger(
      value
    ) ||
    value < 1
  ) {

    return 1;

  }


  return Math.min(
    value,
    9999
  );

}


function setAddQuantity(
  value
) {

  const quantity =
    Math.min(
      9999,
      Math.max(
        1,
        value
      )
    );


  quantityInput.value =
    quantity;


  refreshAddQuantityButtons();

}


function refreshAddQuantityButtons() {

  const quantity =
    getAddQuantity();


  addQtyMinus.disabled =
    quantity <= 1;


  addQtyPlus.disabled =
    quantity >= 9999;

}


addQtyMinus
  .addEventListener(
    'click',
    () => {

      setAddQuantity(
        getAddQuantity() -
        1
      );

    }
  );


addQtyPlus
  .addEventListener(
    'click',
    () => {

      setAddQuantity(
        getAddQuantity() +
        1
      );

    }
  );


quantityInput
  .addEventListener(
    'input',
    refreshAddQuantityButtons
  );


quantityInput
  .addEventListener(
    'blur',
    () => {

      setAddQuantity(
        getAddQuantity()
      );

    }
  );



/* ADD ITEM */

addItemForm
  .addEventListener(
    'submit',
    async event => {

      event.preventDefault();


      const itemName =
        normalizeItemName(
          itemNameInput.value
        );


      /*
        If Add Item was opened from a store,
        lockedAddStore overrides everything.
      */

      const store =
        lockedAddStore ||
        storeSelect.value;


      const quantity =
        getAddQuantity();


      if (
        !itemName
      ) {

        showToast(
          'Please enter an item.',
          true
        );


        itemNameInput.focus();


        return;

      }


      if (
        !store ||
        !STORES[
          store
        ]
      ) {

        showToast(
          'Please choose a store.',
          true
        );


        storeSelect.focus();


        return;

      }


      if (
        itemName
          .toLocaleLowerCase() ===
        'case of water'
      ) {

        showToast(
          'Case of Water is already on the Sam’s / CostCo list.',
          true
        );


        return;

      }


      if (
        !lockedAddStore
      ) {

        rememberLastStore(
          store
        );

      }


      saveItemButton.disabled =
        true;


      saveItemButton.textContent =
        'Adding…';


      try {

        const result =
          await api(

            '/rest/v1/rpc/add_shopping_item',

            {
              method:
                'POST',

              body:
                JSON.stringify(
                  {
                    p_item_name:
                      itemName,

                    p_quantity:
                      quantity,

                    p_store:
                      store
                  }
                )
            }

          );


        const resultData =
          Array.isArray(
            result
          )
            ? result[0]
            : result;


        if (
          resultData &&
          resultData.added ===
            false
        ) {

          const existingStore =
            STORES[
              resultData
                .existing_store
            ] ||
            'another';


          showToast(
            `${itemName} is already on the ${existingStore} list.`,
            true
          );


          return;

        }


        itemNameInput.value =
          '';


        setAddQuantity(
          1
        );


        showToast(
          `${itemName} added to ${STORES[store]}.`
        );


        loadHomeCounts();


        itemNameInput.focus();


      } catch (
        error
      ) {

        console.error(
          error
        );


        showToast(
          'Could not add the item. Please try again.',
          true
        );


      } finally {

        saveItemButton.disabled =
          false;


        saveItemButton.textContent =
          'Add Item';

      }

    }
  );



/* LOAD STORE */

async function loadStoreItems(
  quiet = false
) {

  if (
    !currentStore
  ) {

    return;

  }


  const storeAtStart =
    currentStore;


  if (
    !quiet
  ) {

    storeList.innerHTML =
      '<div class="loading-state">Loading…</div>';

  }


  try {

    const data =
      await api(

        '/rest/v1/shopping_items' +

        '?select=id,item_name,quantity,store' +

        '&store=eq.' +

        encodeURIComponent(
          storeAtStart
        )

      );


    if (
      currentStore !==
      storeAtStart
    ) {

      return;

    }


    const items =
      Array.isArray(
        data
      )
        ? data
        : [];


    items.sort(
      (a, b) =>

        a.item_name
          .localeCompare(
            b.item_name,
            undefined,
            {
              sensitivity:
                'base',

              numeric:
                true
            }
          )
    );


    renderStoreList(
      items
    );


  } catch (
    error
  ) {

    console.error(
      error
    );


    if (
      !quiet &&
      currentStore ===
        storeAtStart
    ) {

      storeList.innerHTML =
        '<div class="error-state">Could not load this list. Please try again.</div>';

    }

  }

}



/* RENDER STORE */

function renderStoreList(
  items
) {

  storeList.innerHTML =
    '';


  if (
    currentStore ===
    'sams_costco'
  ) {

    storeList.appendChild(
      createPermanentWaterRow()
    );

  }


  items.forEach(
    item => {

      storeList.appendChild(
        createItemRow(
          item
        )
      );

    }
  );


  if (
    items.length ===
    0
  ) {

    const empty =
      document.createElement(
        'div'
      );


    empty.className =
      'empty-state';


    empty.textContent =
      currentStore ===
        'sams_costco'

        ? 'No other items on this list.'

        : 'No items on this list.';


    storeList.appendChild(
      empty
    );

  }

}



/* PERMANENT WATER */

function createPermanentWaterRow() {

  const row =
    document.createElement(
      'div'
    );


  row.className =
    'item-row permanent-row';


  const nameWrap =
    document.createElement(
      'div'
    );


  const name =
    document.createElement(
      'div'
    );


  name.className =
    'item-name';


  name.textContent =
    'Case of Water';


  const note =
    document.createElement(
      'div'
    );


  note.className =
    'fixed-note';


  note.textContent =
    'Always on list';


  nameWrap.append(
    name,
    note
  );


  const qty =
    document.createElement(
      'div'
    );


  qty.className =
    'qty-fixed';


  qty.textContent =
    '1';


  const spacer =
    document.createElement(
      'div'
    );


  row.append(
    nameWrap,
    qty,
    spacer
  );


  return row;

}



/* NORMAL ITEM ROW */

function createItemRow(
  item
) {

  const row =
    document.createElement(
      'div'
    );


  row.className =
    'item-row db-row';


  row.dataset.id =
    item.id;


  const name =
    document.createElement(
      'div'
    );


  name.className =
    'item-name';


  name.textContent =
    item.item_name;


  const qtyControl =
    document.createElement(
      'div'
    );


  qtyControl.className =
    'qty-control';


  const minus =
    document.createElement(
      'button'
    );


  minus.type =
    'button';


  minus.className =
    'qty-step-button';


  minus.textContent =
    '−';


  minus.setAttribute(
    'aria-label',
    `Decrease ${item.item_name}`
  );


  const qty =
    document.createElement(
      'input'
    );


  qty.className =
    'qty-input';


  qty.type =
    'number';


  qty.min =
    '1';


  qty.max =
    '9999';


  qty.step =
    '1';


  qty.inputMode =
    'numeric';


  qty.value =
    item.quantity;


  qty.dataset.savedValue =
    String(
      item.quantity
    );


  qty.setAttribute(
    'aria-label',
    `Quantity for ${item.item_name}`
  );


  const plus =
    document.createElement(
      'button'
    );


  plus.type =
    'button';


  plus.className =
    'qty-step-button';


  plus.textContent =
    '+';


  plus.setAttribute(
    'aria-label',
    `Increase ${item.item_name}`
  );


  function refreshButtons() {

    const value =
      getRowQuantity(
        qty
      );


    minus.disabled =
      value <= 1;


    plus.disabled =
      value >= 9999;

  }


  minus.addEventListener(
    'click',
    async () => {

      const value =
        getRowQuantity(
          qty
        );


      if (
        value <= 1
      ) {

        return;

      }


      qty.value =
        value - 1;


      await saveRowQuantity(
        item.id,
        qty,
        minus,
        plus
      );

    }
  );


  plus.addEventListener(
    'click',
    async () => {

      const value =
        getRowQuantity(
          qty
        );


      if (
        value >= 9999
      ) {

        return;

      }


      qty.value =
        value + 1;


      await saveRowQuantity(
        item.id,
        qty,
        minus,
        plus
      );

    }
  );


  qty.addEventListener(
    'focus',
    () => {

      qty.select();

    }
  );


  qty.addEventListener(
    'input',
    refreshButtons
  );


  qty.addEventListener(
    'change',
    () => {

      saveRowQuantity(
        item.id,
        qty,
        minus,
        plus
      );

    }
  );


  qtyControl.append(
    minus,
    qty,
    plus
  );


  refreshButtons();


  const del =
    document.createElement(
      'button'
    );


  del.type =
    'button';


  del.className =
    'delete-button';


  del.textContent =
    '×';


  del.setAttribute(
    'aria-label',
    `Delete ${item.item_name}`
  );


  del.addEventListener(
    'click',
    () => {

      deleteItem(
        item.id,
        item.item_name,
        row,
        del
      );

    }
  );


  row.append(
    name,
    qtyControl,
    del
  );


  return row;

}



/* ROW QUANTITY */

function getRowQuantity(
  input
) {

  const value =
    Number.parseInt(
      input.value,
      10
    );


  if (
    !Number.isInteger(
      value
    ) ||
    value < 1
  ) {

    return 1;

  }


  return Math.min(
    value,
    9999
  );

}


async function saveRowQuantity(
  id,
  input,
  minusButton,
  plusButton
) {

  const oldValue =
    Number.parseInt(
      input.dataset
        .savedValue,
      10
    );


  const newValue =
    getRowQuantity(
      input
    );


  input.value =
    newValue;


  minusButton.disabled =
    true;


  plusButton.disabled =
    true;


  input.disabled =
    true;


  if (
    newValue ===
    oldValue
  ) {

    input.disabled =
      false;


    minusButton.disabled =
      newValue <= 1;


    plusButton.disabled =
      newValue >= 9999;


    return;

  }


  try {

    await api(

      '/rest/v1/shopping_items?id=eq.' +

      encodeURIComponent(
        id
      ),

      {
        method:
          'PATCH',

        headers: {
          Prefer:
            'return=minimal'
        },

        body:
          JSON.stringify(
            {
              quantity:
                newValue
            }
          )
      }

    );


    input.dataset.savedValue =
      String(
        newValue
      );


    showToast(
      'Quantity updated.'
    );


  } catch (
    error
  ) {

    console.error(
      error
    );


    input.value =
      oldValue;


    showToast(
      'Could not update the quantity.',
      true
    );

  }


  const currentValue =
    getRowQuantity(
      input
    );


  input.disabled =
    false;


  minusButton.disabled =
    currentValue <= 1;


  plusButton.disabled =
    currentValue >= 9999;

}



/* DELETE ITEM */

async function deleteItem(
  id,
  itemName,
  row,
  button
) {

  button.disabled =
    true;


  try {

    await api(

      '/rest/v1/shopping_items?id=eq.' +

      encodeURIComponent(
        id
      ),

      {
        method:
          'DELETE',

        headers: {
          Prefer:
            'return=minimal'
        }
      }

    );


    row.remove();


    showToast(
      `${itemName} removed.`
    );


    loadHomeCounts();


    if (
      !storeList
        .querySelector(
          '.db-row'
        )
    ) {

      const empty =
        document.createElement(
          'div'
        );


      empty.className =
        'empty-state';


      empty.textContent =
        currentStore ===
          'sams_costco'

        ? 'No other items on this list.'

        : 'No items on this list.';


      storeList.appendChild(
        empty
      );

    }


  } catch (
    error
  ) {

    console.error(
      error
    );


    button.disabled =
      false;


    showToast(
      'Could not remove the item.',
      true
    );

  }

}



/* PAGE EVENTS */

window.addEventListener(
  'hashchange',
  route
);


document.addEventListener(
  'visibilitychange',
  () => {

    if (
      document.hidden
    ) {

      return;

    }


    if (
      currentStore
    ) {

      loadStoreItems(
        true
      );

    } else {

      loadHomeCounts();

    }

  }
);



/* START */

if (
  !location.hash
) {

  history.replaceState(
    null,
    '',
    '#home'
  );

}


route();

</script>

</body>
</html>
