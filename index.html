<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- APP VERSION: 1.0.21 -->
<meta name="app-version" content="1.0.21">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Uno Shopping">

<title>Uno Club Shopping</title>

<link rel="icon" type="image/png" href="uno-club-shopping.PNG?v=1.0.21">
<link rel="apple-touch-icon" href="uno-club-shopping.PNG?v=1.0.21">

<style>
:root{
  --black:#0b0b0b;
  --page:#f5f6f8;
  --white:#fff;
  --blue:#1e5acb;
  --blue-dark:#15459f;
  --green:#218c4f;
  --green-dark:#176b3a;
  --red:#c62828;
  --red-dark:#991f1f;
  --border:#d9d9d9;
  --text:#171717;
  --muted:#6b7280;
  --danger:#c62828;
  --shadow:0 8px 24px rgba(0,0,0,.10);
  --radius:16px
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--page);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%
}

body{
  min-height:100vh;
  min-height:100dvh
}

button,input,select{
  font:inherit
}

button{
  touch-action:manipulation
}

.app-header{
  height:calc(82px + env(safe-area-inset-top));
  padding:calc(9px + env(safe-area-inset-top)) 14px 9px;
  background:var(--black);
  color:var(--white);
  display:flex;
  align-items:center;
  gap:10px;
  position:fixed;
  inset:0 0 auto 0;
  z-index:1000;
  box-shadow:0 2px 10px rgba(0,0,0,.22)
}

.app-header h1{
  flex:1;
  min-width:0;
  margin:0;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:22px;
  line-height:1.1;
  font-weight:850
}

.header-logo{
  width:58px;
  height:58px;
  flex:0 0 58px;
  object-fit:cover;
  border-radius:12px;
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 4px 12px rgba(0,0,0,.35)
}

.back-button{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:var(--white);
  font-size:32px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center
}

.back-button[hidden]{
  display:none!important
}

.back-button:active{
  background:rgba(255,255,255,.12)
}

main{
  width:min(100%,620px);
  margin:0 auto;
  padding:calc(104px + env(safe-area-inset-top)) 16px calc(42px + env(safe-area-inset-bottom))
}

.screen[hidden]{
  display:none!important
}

#homeScreen:not([hidden]){
  display:flex;
  flex-direction:column;
  min-height:calc(100dvh - 155px - env(safe-area-inset-top))
}

.button-stack,
.category-stack,
.home-bottom-menu{
  display:grid;
  gap:13px
}

.home-bottom-menu{
  margin-top:auto;
  padding-top:22px;
  margin-bottom:24px
}

.main-button,
.save-button{
  width:100%;
  min-height:62px;
  border:2px solid var(--black);
  border-radius:14px;
  background:var(--blue);
  color:var(--white);
  font-size:20px;
  font-weight:800;
  box-shadow:0 5px 14px rgba(30,90,203,.24);
  cursor:pointer;
  transition:transform .08s ease,background .15s ease
}

.main-button:active,
.save-button:active{
  transform:scale(.985);
  background:var(--blue-dark)
}

.main-button.add-item,
.store-add-button,
.inventory-add-button{
  background:var(--black);
  box-shadow:0 5px 14px rgba(0,0,0,.20)
}

.store-button{
  position:relative
}

.store-add-button,
.inventory-add-button{
  margin-bottom:13px
}

.secondary-menu-button{
  min-height:54px;
  font-size:17px
}

#inventoryButton{
  background:var(--green);
  box-shadow:0 5px 14px rgba(33,140,79,.24)
}

#inventoryButton:active{
  background:var(--green-dark)
}

#manageRestrictionsButton{
  background:var(--red);
  box-shadow:0 5px 14px rgba(198,40,40,.24)
}

#manageRestrictionsButton:active{
  background:var(--red-dark)
}

.count-badge{
  position:absolute;
  top:7px;
  right:8px;
  min-width:29px;
  height:29px;
  padding:0 7px;
  border-radius:15px;
  background:var(--white);
  color:var(--blue);
  border:2px solid var(--black);
  font-size:15px;
  font-weight:900;
  line-height:25px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,.18);
  pointer-events:none
}

.version-label{
  position:fixed;
  left:10px;
  bottom:calc(7px + env(safe-area-inset-bottom));
  color:#000;
  font-size:11px;
  font-weight:500;
  z-index:10;
  pointer-events:none
}

.card,
.restriction-list{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden
}

.form-card{
  padding:18px
}

.field{
  margin-bottom:18px
}

.field label,
.field-label{
  display:block;
  margin-bottom:7px;
  font-size:15px;
  font-weight:800
}

.field input,
.field select{
  width:100%;
  min-height:54px;
  padding:12px 13px;
  border:1.5px solid var(--border);
  border-radius:12px;
  background:var(--white);
  color:var(--text);
  font-size:18px;
  outline:none
}

.field input:focus,
.field select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(30,90,203,.12)
}

.field select:disabled{
  opacity:1;
  background:#eee;
  color:#4b5563;
  -webkit-text-fill-color:#4b5563;
  border-color:#b8b8b8
}

.locked-note,
.form-note{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
  font-weight:650
}

.locked-note[hidden]{
  display:none!important
}

.qty-control{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px
}

.qty-step-button{
  width:36px;
  height:44px;
  flex:0 0 36px;
  border:2px solid var(--black);
  border-radius:10px;
  background:var(--white);
  color:var(--black);
  font-size:24px;
  font-weight:900;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer
}

.qty-step-button:active{
  background:#e7e7e7
}

.qty-step-button:disabled{
  opacity:.35
}

.qty-input{
  width:48px;
  min-height:44px;
  padding:4px;
  border:1.5px solid var(--border);
  border-radius:10px;
  background:var(--white);
  color:var(--text);
  text-align:center;
  font-size:18px;
  font-weight:800;
  outline:none;
  -moz-appearance:textfield
}

.qty-input::-webkit-outer-spin-button,
.qty-input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0
}

.qty-input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(30,90,203,.12)
}

.add-qty-control{
  justify-content:flex-start
}

.add-qty-control .qty-step-button{
  width:48px;
  height:52px;
  flex:0 0 48px
}

.add-qty-control .qty-input{
  width:76px;
  min-height:52px;
  font-size:20px
}

.list-card{
  padding:0
}

.list-heading,
.item-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 132px 48px;
  gap:8px;
  align-items:center
}

.list-heading{
  padding:12px 14px;
  background:#edf3ff;
  border-bottom:1px solid var(--border);
  color:#364152;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.7px
}

.list-heading span:nth-child(2){
  text-align:center
}

.item-row{
  min-height:66px;
  padding:9px 14px;
  border-bottom:1px solid #ececec
}

.item-row:last-child{
  border-bottom:0
}

.item-name{
  min-width:0;
  font-size:17px;
  font-weight:750;
  overflow-wrap:anywhere
}

.qty-fixed{
  width:48px;
  min-height:44px;
  margin:0 auto;
  border:1.5px solid var(--border);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f1f3f6;
  color:#515865;
  font-size:18px;
  font-weight:800
}

.delete-button{
  width:44px;
  height:44px;
  border:2px solid var(--black);
  border-radius:11px;
  background:#fff1f1;
  color:var(--danger);
  font-size:28px;
  line-height:1;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center
}

.delete-button:active{
  background:#ffdede
}

.delete-button:disabled{
  opacity:.45
}

.permanent-row{
  background:#f7faff
}

.fixed-note{
  color:var(--blue);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-top:3px
}

.category-button{
  text-align:left;
  padding:0 18px
}

.category-button::after{
  content:'›';
  float:right;
  font-size:29px;
  font-weight:500;
  line-height:24px
}

.inventory-category-note{
  margin:0 0 13px;
  color:var(--muted);
  font-size:13px;
  font-weight:650;
  text-align:center
}

.restrictions-toolbar{
  margin-bottom:13px
}

.restriction-row{
  width:100%;
  border:0;
  border-bottom:1px solid #ececec;
  background:var(--white);
  color:var(--text);
  padding:14px 15px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  text-align:left;
  cursor:pointer
}

.restriction-row:last-child{
  border-bottom:0
}

.restriction-row:active{
  background:#edf3ff
}

.restriction-name{
  font-size:17px;
  font-weight:800;
  overflow-wrap:anywhere
}

.restriction-stores{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
  font-weight:650
}

.restriction-chevron{
  color:var(--blue);
  font-size:30px;
  line-height:1;
  font-weight:500
}

.store-checks{
  display:grid;
  gap:9px
}

.store-check-row{
  min-height:50px;
  padding:8px 12px;
  border:1.5px solid var(--border);
  border-radius:12px;
  background:#fafafa;
  display:flex!important;
  align-items:center;
  gap:11px;
  cursor:pointer;
  font-size:17px!important;
  font-weight:700!important
}

.store-check-row input{
  width:23px;
  height:23px;
  margin:0;
  accent-color:var(--blue)
}

.delete-restriction-button{
  width:100%;
  min-height:54px;
  margin-top:14px;
  border:2px solid var(--black);
  border-radius:14px;
  background:#fff1f1;
  color:var(--danger);
  font-size:18px;
  font-weight:850;
  cursor:pointer
}

.delete-restriction-button[hidden]{
  display:none!important
}

.delete-restriction-button:active{
  background:#ffdede
}

.empty-state,
.loading-state,
.error-state{
  padding:28px 18px;
  text-align:center;
  color:var(--muted);
  font-size:16px
}

.error-state{
  color:var(--danger)
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translate(-50%,18px);
  width:min(calc(100% - 32px),520px);
  min-height:52px;
  padding:9px 10px 9px 16px;
  border-radius:12px;
  background:var(--black);
  color:var(--white);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  text-align:center;
  font-weight:700;
  box-shadow:0 8px 30px rgba(0,0,0,.26);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;
  z-index:2000
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
  pointer-events:auto
}

.toast.error{
  background:#8f1d1d
}

.toast-message{
  min-width:0
}

.toast-undo-button{
  flex:0 0 auto;
  min-height:36px;
  padding:6px 12px;
  border:1.5px solid var(--white);
  border-radius:9px;
  background:transparent;
  color:var(--white);
  font-size:14px;
  font-weight:900;
  cursor:pointer
}

.toast-undo-button[hidden]{
  display:none!important
}

.toast-undo-button:active{
  background:rgba(255,255,255,.18)
}

.toast-undo-button:disabled{
  opacity:.5
}

@media(max-width:390px){
  .app-header h1{
    font-size:19px
  }

  .list-heading,
  .item-row{
    grid-template-columns:minmax(0,1fr) 124px 44px;
    gap:5px;
    padding-left:10px;
    padding-right:10px
  }

  .qty-step-button{
    width:34px;
    flex-basis:34px
  }

  .qty-input{
    width:44px
  }
}
</style>
</head>

<body>

<header class="app-header">

  <button
    id="backButton"
    class="back-button"
    type="button"
    aria-label="Back"
    hidden
  >
    &larr;
  </button>

  <h1 id="pageTitle">Uno Club Shopping</h1>

  <img
    class="header-logo"
    src="uno-club-shopping.PNG?v=1.0.21"
    alt="Uno Club Shopping logo"
  >

</header>

<main>

  <section id="homeScreen" class="screen">

    <div class="button-stack">

      <button id="addItemButton" class="main-button add-item" type="button">
        Add Item
      </button>

      <button class="main-button store-button" type="button" data-store="sams_costco">
        Sam’s / CostCo
        <span class="count-badge" data-count-store="sams_costco">1</span>
      </button>

      <button class="main-button store-button" type="button" data-store="walmart">
        Walmart
        <span class="count-badge" data-count-store="walmart">0</span>
      </button>

      <button class="main-button store-button" type="button" data-store="alcohol">
        Alcohol
        <span class="count-badge" data-count-store="alcohol">0</span>
      </button>

      <button class="main-button store-button" type="button" data-store="sodas">
        Sodas
        <span class="count-badge" data-count-store="sodas">0</span>
      </button>

      <button class="main-button store-button" type="button" data-store="amazon">
        Amazon
        <span class="count-badge" data-count-store="amazon">0</span>
      </button>

    </div>

    <div class="home-bottom-menu">

      <button
        id="inventoryButton"
        class="main-button secondary-menu-button"
        type="button"
      >
        Inventory
      </button>

      <button
        id="manageRestrictionsButton"
        class="main-button secondary-menu-button"
        type="button"
      >
        Manage Restrictions
      </button>

    </div>

    <div class="version-label">
      v1.0.21
    </div>

  </section>


  <section id="addScreen" class="screen" hidden>

    <div class="card form-card">

      <form id="addItemForm">

        <div class="field">

          <label for="itemName">
            What item would you like to add?
          </label>

          <input
            id="itemName"
            type="text"
            maxlength="100"
            autocomplete="off"
            required
          >

        </div>

        <div class="field">

          <label>Quantity</label>

          <div class="qty-control add-qty-control">

            <button
              id="addQtyMinus"
              class="qty-step-button"
              type="button"
              aria-label="Decrease quantity"
            >
              −
            </button>

            <input
              id="quantity"
              class="qty-input"
              type="number"
              min="1"
              max="9999"
              step="1"
              inputmode="numeric"
              value="1"
              aria-label="Quantity"
            >

            <button
              id="addQtyPlus"
              class="qty-step-button"
              type="button"
              aria-label="Increase quantity"
            >
              +
            </button>

          </div>

        </div>

        <div class="field">

          <label for="store">
            Store
          </label>

          <select id="store" required></select>

          <div
            id="lockedStoreNote"
            class="locked-note"
            hidden
          >
            This item will be added to this store.
          </div>

        </div>

        <button
          id="saveItemButton"
          class="save-button"
          type="submit"
        >
          Add Item
        </button>

      </form>

    </div>

  </section>


  <section id="storeScreen" class="screen" hidden>

    <button
      id="storeAddItemButton"
      class="main-button store-add-button"
      type="button"
    >
      Add Item
    </button>

    <div class="card list-card">

      <div class="list-heading">
        <span>Item</span>
        <span>Qty</span>
        <span></span>
      </div>

      <div id="storeList"></div>

    </div>

  </section>


  <section id="inventoryScreen" class="screen" hidden">

    <div
      id="inventoryCategoryButtons"
      class="category-stack"
    ></div>

  </section>


  <section id="inventoryCategoryScreen" class="screen" hidden>

    <button
      id="inventoryAddItemButton"
      class="main-button inventory-add-button"
      type="button"
    >
      Add Item
    </button>

    <div class="card list-card">

      <div class="list-heading">
        <span>Item</span>
        <span>Qty</span>
        <span></span>
      </div>

      <div id="inventoryList"></div>

    </div>

  </section>


  <section id="inventoryAddScreen" class="screen" hidden>

    <div class="card form-card">

      <form id="inventoryAddForm">

        <div class="field">

          <label for="inventoryItemName">
            Item
          </label>

          <input
            id="inventoryItemName"
            type="text"
            maxlength="100"
            autocomplete="off"
            required
          >

        </div>

        <div class="field">

          <label>
            Quantity in Stock
          </label>

          <div class="qty-control add-qty-control">

            <button
              id="inventoryQtyMinus"
              class="qty-step-button"
              type="button"
            >
              −
            </button>

            <input
              id="inventoryQuantity"
              class="qty-input"
              type="number"
              min="0"
              max="9999"
              step="1"
              inputmode="numeric"
              value="1"
            >

            <button
              id="inventoryQtyPlus"
              class="qty-step-button"
              type="button"
            >
              +
            </button>

          </div>

        </div>

        <div
          id="inventoryCategoryNote"
          class="inventory-category-note"
        ></div>

        <button
          id="saveInventoryItemButton"
          class="save-button"
          type="submit"
        >
          Add to Inventory
        </button>

      </form>

    </div>

  </section>


  <section id="restrictionsScreen" class="screen" hidden>

    <div class="category-stack">

      <button
        id="restrictionsByItemButton"
        class="main-button category-button"
        type="button"
      >
        By Item
      </button>

      <button
        id="restrictionsByStoreButton"
        class="main-button category-button"
        type="button"
      >
        By Store
      </button>

    </div>

  </section>


  <section id="restrictionsByItemScreen" class="screen" hidden>

    <div class="restrictions-toolbar">

      <button
        id="addRestrictionButton"
        class="main-button add-item"
        type="button"
      >
        Add Restriction
      </button>

    </div>

    <div
      id="restrictionList"
      class="restriction-list"
    ></div>

  </section>


  <section id="restrictionsByStoreScreen" class="screen" hidden>

    <div
      id="restrictionStoreButtons"
      class="category-stack"
    ></div>

  </section>


  <section id="restrictionStoreScreen" class="screen" hidden>

    <div
      id="restrictionStoreList"
      class="restriction-list"
    ></div>

  </section>


  <section id="restrictionEditScreen" class="screen" hidden>

    <div class="card form-card">

      <form id="restrictionForm">

        <div class="field">

          <label for="restrictionItemName">
            Item
          </label>

          <input
            id="restrictionItemName"
            type="text"
            maxlength="100"
            autocomplete="off"
            required
          >

        </div>

        <div class="field">

          <div class="field-label">
            Allowed Stores
          </div>

          <div class="store-checks">

            <label class="store-check-row">
              <input type="checkbox" name="allowedStore" value="sams_costco">
              <span>Sam’s / CostCo</span>
            </label>

            <label class="store-check-row">
              <input type="checkbox" name="allowedStore" value="walmart">
              <span>Walmart</span>
            </label>

            <label class="store-check-row">
              <input type="checkbox" name="allowedStore" value="alcohol">
              <span>Alcohol</span>
            </label>

            <label class="store-check-row">

      store

function getLastStore() {

  return null;

function sortByName(

async function api(
  path,
  options = {}
) {

  const headers = {

    apikey:
      SUPABASE_PUBLISHABLE_KEY,

    Accept:
      'application/json',

    ...(options.body
      ? {
          'Content-Type':
            'application/json'
        }
      : {}),

    ...(options.headers || {})

  };


  const response =
    await fetch(
      SUPABASE_URL + path,
      {
        ...options,
        headers
      }
    );


  if (
    !response.ok
  ) {

    let message =
      `Request failed (${response.status})`;


    try {

      const data =
        await response.json();


      message =
        data.message ||
        data.error_description ||
        data.hint ||
        message;


    } catch (_) {

      const text =
        await response.text();


      if (
        text
      ) {

        message =
          text;

      }

    }


    throw new Error(
      message
    );

  }


  if (
    response.status ===
    204
  ) {

    return null;

  }


  const text =
    await response.text();


  return text
    ? JSON.parse(
        text
      )
    : null;

}

function rebuildStoreOptions(
  storeKeys,
  selectedStore = ''
) {

  storeSelect.innerHTML =
    '';


  const placeholder =
    document.createElement(
      'option'
    );


  placeholder.value =
    '';


  placeholder.textContent =
    'Choose a store';


  placeholder.disabled =
    true;


  storeSelect.appendChild(
    placeholder
  );


  storeKeys.forEach(
    storeKey => {

      if (
        !STORES[
          storeKey
        ]
      ) {

        return;

      }


      const option =
        document.createElement(
          'option'
        );


      option.value =
        storeKey;


      option.textContent =
        STORES[
          storeKey
        ];


      storeSelect.appendChild(
        option
      );

    }
  );


  if (
    selectedStore &&
    storeKeys.includes(
      selectedStore
    )
  ) {

    storeSelect.value =
      selectedStore;

  } else {

    storeSelect.value =
      '';

  }

}



async function refreshStoreChoicesForItem(
  preferBlank = false
) {

  if (
    lockedAddStore
  ) {

    rebuildStoreOptions(
      [
        lockedAddStore
      ],
      lockedAddStore
    );


    return;

  }


  const itemName =
    normalizeItemName(
      itemNameInput.value
    );


  const previousStore =
    storeSelect.value;


  const requestNumber =
    ++storeRestrictionRequestNumber;


  if (
    !itemName
  ) {

    const selected =
      preferBlank
        ? ''
        : (
            previousStore ||
            getLastStore() ||
            ''
          );


    rebuildStoreOptions(
      Object.keys(
        STORES
      ),
      selected
    );


    return;

  }


  try {

    const rows =
      await fetchRestrictionRows();


    if (
      requestNumber !==
      storeRestrictionRequestNumber
    ) {

      return;

    }


    const key =
      normalizedKey(
        itemName
      );


    const matches =
      rows.filter(
        row =>
          normalizedKey(
            row.item_name
          ) ===
          key
      );


    let allowedStores;


    if (
      matches.length
    ) {

      const allowedSet =
        new Set(
          matches.map(
            row =>
              row.allowed_store
          )
        );


      allowedStores =
        Object.keys(
          STORES
        )
        .filter(
          store =>
            allowedSet.has(
              store
            )
        );

    } else {

      allowedStores =
        Object.keys(
          STORES
        );

    }


    let selectedStore =
      '';


    if (
      allowedStores.length ===
      1
    ) {

      selectedStore =
        allowedStores[0];

    } else if (
      !preferBlank &&
      previousStore &&
      allowedStores.includes(
        previousStore
      )
    ) {

      selectedStore =
        previousStore;

    } else if (
      !preferBlank
    ) {

      const lastStore =
        getLastStore();


      if (
        lastStore &&
        allowedStores.includes(
          lastStore
        )
      ) {

        selectedStore =
          lastStore;

      }

    }


    rebuildStoreOptions(
      allowedStores,
      selectedStore
    );


  } catch (error) {

    console.error(
      error
    );


    if (
      requestNumber !==
      storeRestrictionRequestNumber
    ) {

      return;

    }


    rebuildStoreOptions(
      Object.keys(
        STORES
      ),
      preferBlank
        ? ''
        : (
            previousStore ||
            getLastStore() ||
            ''
          )
    );

  }

}

function getBoundedQuantity(
  input,
  min
) {

  const value =
    Number.parseInt(
      input.value,
      10
    );


  if (
    !Number.isInteger(
      value
    ) ||
    value < min
  ) {

    return min;

  }


  return Math.min(
    value,
    9999
  );

}

function formatAllowedStores(
  storeKeys
) {

  const names =
    storeKeys
      .map(
        store =>
          STORES[
            store
          ]
      )
      .filter(
        Boolean
      );


  if (
    !names.length
  ) {

    return 'the correct store';

  }


  if (
    names.length ===
    1
  ) {

    return names[0];

  }


  if (
    names.length ===
    2
  ) {

    return (
      names[0] +
      ' or ' +
      names[1]
    );

  }


  return (
    names
      .slice(
        0,
        -1
      )
      .join(
        ', '
      ) +
    ', or ' +
    names[
      names.length -
      1
    ]
  );

}



addItemForm
  .addEventListener(

    async event => {

      event.preventDefault();


      const itemName =
        normalizeItemName(
          itemNameInput.value
        );

        lockedAddStore ||
        storeSelect.value;


      const quantity =
        getAddQuantity();


      if (
        !itemName
      ) {

        showToast(
          'Please enter an item.',
          true
        );


        itemNameInput.focus();


        return;

      }


      if (
        !store ||
        !STORES[
          store
        ]
      ) {

        showToast(
          'Please choose a store.',
          true
        );


        storeSelect.focus();


        return;

      }


      if (
        normalizedKey(
          itemName
        ) ===
        'case of water'
      ) {

        showToast(
          'Case of Water is already on the Sam’s / CostCo list.',
          true
        );


        return;

      }


      if (
        !lockedAddStore
      ) {

        rememberLastStore(
          store
        );

      }


      saveItemButton.disabled =
        true;


      saveItemButton.textContent =
        'Adding…';


      try {

        const result =
          unwrapRpcResult(

            await api(
              '/rest/v1/rpc/add_shopping_item',
              {
                method:
                  'POST',

                body:
                  JSON.stringify({
                    p_item_name:
                      itemName,

                    p_quantity:
                      quantity,

                    p_store:
                      store
                  })
              }
            )

          );


        if (
          result &&
          result.added === false &&
          result.reason ===
            'duplicate'
        ) {

          showToast(
            `${itemName} is already on the ${STORES[result.existing_store] || 'another'} list.`,
            true
          );


          return;

        }


        if (
          result &&
          result.added === false &&
          result.reason ===
            'restricted'
        ) {

            `${itemName} can only be added to ${formatAllowedStores(Array.isArray(result.allowed_stores) ? result.allowed_stores : [])}.`,
            true
          );


          refreshStoreChoicesForItem(

          );

          );

        );

        );

          'Could not add the item. Please try again.',
          true
        );


      } finally {

        saveItemButton.disabled =
          false;

function createDataItemRow(
  item,
  minQuantity,
  saveQuantity,
  deleteHandler,
  afterSaveQuantity = null
) {

  const row =
    document.createElement(
      'div'
    );


  row.className =
    'item-row db-row';


  row.dataset.id =
    item.id;


  const name =
    document.createElement(
      'div'
    );


  name.className =
    'item-name';


  name.textContent =
    item.item_name;


  const control =
    document.createElement(
      'div'
    );


  control.className =
    'qty-control';


  const minus =
    document.createElement(
      'button'
    );


  const qty =
    document.createElement(
      'input'
    );


  const plus =
    document.createElement(
      'button'
    );


  minus.type =
    'button';


  plus.type =
    'button';


  minus.className =
    'qty-step-button';


  plus.className =
    'qty-step-button';


  minus.textContent =
    '−';


  plus.textContent =
    '+';


  qty.className =
    'qty-input';


  qty.type =
    'number';


  qty.min =
    String(
      minQuantity
    );


  qty.max =
    '9999';


  qty.step =
    '1';


  qty.inputMode =
    'numeric';


  qty.value =
    item.quantity;


  qty.dataset.savedValue =
    String(
      item.quantity
    );


  const getQty =
    () =>
      getBoundedQuantity(
        qty,
        minQuantity
      );


  const refresh =
    () => {

      const value =
        getQty();


      minus.disabled =
        value <=
        minQuantity;


      plus.disabled =
        value >=
        9999;

    };


  const save =
    async () => {

      const oldValue =
        Number.parseInt(
          qty.dataset.savedValue,
          10
        );


      const newValue =
        getQty();


      qty.value =
        newValue;


      if (
        newValue ===
        oldValue
      ) {

        refresh();

        return;

      }


      minus.disabled =
        true;


      plus.disabled =
        true;


      qty.disabled =
        true;


      let saveSucceeded =
        false;


      try {

        await saveQuantity(
          newValue
        );


        qty.dataset.savedValue =
          String(
            newValue
          );


        saveSucceeded =
          true;


      } catch (error) {

        console.error(
          error
        );


        qty.value =
          oldValue;


        showToast(
          'Could not update the quantity.',
          true
        );

      }


      qty.disabled =
        false;


      refresh();


      if (
        !saveSucceeded
      ) {

        return;

      }


      let handledAfterSave =
        false;


      if (
        typeof afterSaveQuantity ===
        'function'
      ) {

        handledAfterSave =
          afterSaveQuantity(
            oldValue,
            newValue
          ) === true;

      }


      if (
        !handledAfterSave
      ) {

        showToast(
          'Quantity updated.'
        );

      }

    };


  minus.addEventListener(
    'click',
    async () => {

      const value =
        getQty();


      if (
        value <=
        minQuantity
      ) {

        return;

      }


      qty.value =
        value - 1;


      await save();

    }
  );


  plus.addEventListener(
    'click',
    async () => {

      const value =
        getQty();


      if (
        value >=
        9999
      ) {

        return;

      }


      qty.value =
        value + 1;


      await save();

    }
  );


  qty.addEventListener(
    'focus',
    () => {

      qty.select();

    }
  );


  qty.addEventListener(
    'input',
    refresh
  );


  qty.addEventListener(
    'change',
    save
  );


  control.append(
    minus,
    qty,
    plus
  );


  refresh();


  const del =
    document.createElement(
      'button'
    );


  del.type =
    'button';


  del.className =
    'delete-button';


  del.textContent =
    '×';


  del.addEventListener(
    'click',
    async () => {

      del.disabled =
        true;


      await deleteHandler(
        row,
        del,
        getQty()
      );

    }
  );


  row.append(
    name,
    control,
    del
  );


  return row;

}

      headers:{

          'return=minimal'
      },

      body:
        JSON.stringify({
          quantity
        })
    }
  );

}

          ? data
          : []
      )

    );


  } catch (error) {

    console.error(
      error
    );


    if (
      !quiet &&
      currentInventoryCategory ===
        categoryAtStart
    ) {

      inventoryList.innerHTML =
        '<div class="error-state">Could not load this inventory. Please try again.</div>';

    }

  }

}



function renderInventoryList(
  items
) {

  inventoryList.innerHTML =
    '';


  items.forEach(
    item => {

      inventoryList.appendChild(
        createInventoryItemRow(
          item
        )
      );

    }
  );


  if (
    items.length ===
    0
  ) {

    appendEmpty(
      inventoryList,
      'No items in this category yet.'
    );

  }

}



inventoryAddForm
  .addEventListener(
    'submit',
    async event => {

      event.preventDefault();


      const itemName =
        normalizeItemName(
          inventoryItemName.value
        );


      const quantity =
        getInventoryAddQuantity();


      const category =
        currentInventoryCategory;


      if (
        !itemName
      ) {

        showToast(
          'Please enter an item.',
          true
        );


        inventoryItemName.focus();


        return;

      }


      if (
        !category ||
        !INVENTORY_CATEGORIES[
          category
        ]
      ) {

        showToast(
          'Inventory category not found.',
          true
        );


        return;

      }


      saveInventoryItemButton.disabled =
        true;


      saveInventoryItemButton.textContent =
        'Adding…';


      try {

        const result =
          unwrapRpcResult(

            await api(
              '/rest/v1/rpc/add_inventory_item',
              {
                method:
                  'POST',

                body:
                  JSON.stringify({
                    p_item_name:
                      itemName,

                    p_quantity:
                      quantity,

                    p_category:
                      category
                  })
              }
            )

          );


        if (
          result &&
          result.added === false &&
          result.reason ===
            'duplicate'
        ) {

          showToast(
            `${itemName} is already in ${INVENTORY_CATEGORIES[result.existing_category] || 'Inventory'}.`,
            true
          );


          return;

        }


        if (
          result &&
          result.added ===
            true
        ) {

          inventoryItemName.value =
            '';


          setInventoryAddQuantity(
            1
          );


          showToast(
            `${itemName} added to ${INVENTORY_CATEGORIES[category]}.`
          );


          inventoryItemName.focus();


          return;

        }


        showToast(
          'Could not add the inventory item.',
          true
        );


      } catch (error) {

        console.error(
          error
        );


        showToast(
          'Could not add the inventory item.',
          true
        );


      } finally {

        saveInventoryItemButton.disabled =
          false;


        saveInventoryItemButton.textContent =
          'Add to Inventory';

      }

    }
  );



async function deleteInventoryItem(
  item,
  row,
  button,
  currentQuantity
) {

  try {

    await api(
      '/rest/v1/inventory_items?id=eq.' +
      encodeURIComponent(
        item.id
      ),
      {
        method:
          'DELETE',

        headers:{
          Prefer:
            'return=minimal'
        }
      }
    );


    row.remove();


    showUndoToast(
      {
        ...item,

        quantity:
          currentQuantity
      },
      'inventory'
    );


    if (
      !inventoryList.querySelector(
        '.db-row'
      )
    ) {

      appendEmpty(
        inventoryList,
        'No items in this category yet.'
      );

    }


  } catch (error) {

    console.error(
      error
    );


    button.disabled =
      false;


    showToast(
      'Could not remove the inventory item.',
      true
    );

  }

}



/* RESTRICTIONS */


async function fetchRestrictionRows() {

  const data =
    await api(
      '/rest/v1/item_store_restrictions' +
      '?select=item_name,allowed_store'
    );


  return Array.isArray(
    data
  )
    ? data
    : [];

}



function groupRestrictions(
  rows
) {

  const grouped =
    new Map();


  rows.forEach(
    row => {

      const key =
        normalizedKey(
          row.item_name
        );


      if (
        !grouped.has(
          key
        )
      ) {

        grouped.set(
          key,
          {
            item_name:
              row.item_name,

            allowed_stores:
              []
          }
        );

      }


      const item =
        grouped.get(
          key
        );


      if (
        !item.allowed_stores
          .includes(
            row.allowed_store
          )
      ) {

        item.allowed_stores.push(
          row.allowed_store
        );

      }

    }
  );


  return sortByName(
    Array.from(
      grouped.values()
    )
  );

}



function renderRestrictionStores() {

  restrictionStoreButtons.innerHTML =
    '';


  Object.entries(
    STORES
  )
  .forEach(
    ([key,label]) => {

      const button =
        document.createElement(
          'button'
        );


      button.type =
        'button';


      button.className =
        'main-button category-button';


      button.textContent =
        label;


      button.addEventListener(
        'click',
        () => {

          goRestrictionStore(
            key
          );

        }
      );


      restrictionStoreButtons.appendChild(
        button
      );

    }
  );

}



function createRestrictionRow(
  item
) {

  const button =
    document.createElement(
      'button'
    );


  const wrap =
    document.createElement(
      'div'
    );


  const name =
    document.createElement(
      'div'
    );


  const stores =
    document.createElement(
      'div'
    );


  const chevron =
    document.createElement(
      'div'
    );


  button.type =
    'button';


  button.className =
    'restriction-row';


  name.className =
    'restriction-name';


  name.textContent =
    item.item_name;


  stores.className =
    'restriction-stores';


  stores.textContent =
    Object.keys(
      STORES
    )
    .filter(
      store =>
        item.allowed_stores
          .includes(
            store
          )
    )
    .map(
      store =>
        STORES[
          store
        ]
    )
    .join(
      ' • '
    );


  wrap.append(
    name,
    stores
  );


  chevron.className =
    'restriction-chevron';


  chevron.textContent =
    '›';


  button.append(
    wrap,
    chevron
  );


  button.addEventListener(
    'click',
    () => {

      goEditRestriction(
        item.item_name,
        location.hash
      );

    }
  );


  return button;

}



async function loadRestrictions() {

  restrictionList.innerHTML =
    '<div class="loading-state">Loading…</div>';


  try {

    renderRestrictions(

      groupRestrictions(
        await fetchRestrictionRows()
      )

    );


  } catch (error) {

    console.error(
      error
    );


    restrictionList.innerHTML =
      '<div class="error-state">Could not load restrictions.</div>';

  }

}



function renderRestrictions(
  items
) {

  restrictionList.innerHTML =
    '';


  if (
    !items.length
  ) {

    restrictionList.innerHTML =
      '<div class="empty-state">No restricted items yet.</div>';


    return;

  }


  items.forEach(
    item => {

      restrictionList.appendChild(
        createRestrictionRow(
          item
        )
      );

    }
  );

}



async function loadRestrictionsByStore(
  store
) {

  restrictionStoreList.innerHTML =
    '<div class="loading-state">Loading…</div>';


  try {

    const items =
      groupRestrictions(
        await fetchRestrictionRows()
      )
      .filter(
        item =>
          item.allowed_stores
            .includes(
              store
            )
      );


    if (
      currentRestrictionStore !==
      store
    ) {

      return;

    }


    renderRestrictionsByStore(
      items
    );


  } catch (error) {

    console.error(
      error
    );


    if (
      currentRestrictionStore ===
      store
    ) {

      restrictionStoreList.innerHTML =
        '<div class="error-state">Could not load restrictions for this store.</div>';

    }

  }

}



function renderRestrictionsByStore(
  items
) {

  restrictionStoreList.innerHTML =
    '';


  if (
    !items.length
  ) {

    restrictionStoreList.innerHTML =
      '<div class="empty-state">No restricted items are assigned to this store.</div>';


    return;

  }


  items.forEach(
    item => {

      restrictionStoreList.appendChild(
        createRestrictionRow(
          item
        )
      );

    }
  );

}



function clearRestrictionChecks() {

  document
    .querySelectorAll(
      'input[name="allowedStore"]'
    )
    .forEach(
      checkbox => {

        checkbox.checked =
          false;

      }
    );

}



function clearRestrictionForm() {

  editingRestrictionOriginalName =
    null;


  restrictionItemName.value =
    '';


  clearRestrictionChecks();


  deleteRestrictionButton.hidden =
    true;


  saveRestrictionButton.disabled =
    false;


  saveRestrictionButton.textContent =
    'Save Restriction';

}



async function loadRestrictionForEdit(
  itemName
) {

  restrictionItemName.value =
    '';


  clearRestrictionChecks();


  deleteRestrictionButton.hidden =
    true;


  try {

    const rows =
      await fetchRestrictionRows();


    const targetKey =
      normalizedKey(
        itemName
      );


    const matches =
      rows.filter(
        row =>
          normalizedKey(
            row.item_name
          ) ===
          targetKey
      );


    if (
      !matches.length
    ) {

      showToast(
        'That restriction no longer exists.',
        true
      );


      goRestrictionReturn();


      return;

    }


    const displayName =
      matches[0].item_name;


    editingRestrictionOriginalName =
      displayName;


    restrictionItemName.value =
      displayName;


    matches.forEach(
      row => {

        const checkbox =
          document.querySelector(
            `input[name="allowedStore"][value="${row.allowed_store}"]`
          );


        if (
          checkbox
        ) {

          checkbox.checked =
            true;

        }

      }
    );


    deleteRestrictionButton.hidden =
      false;


  } catch (error) {

    console.error(
      error
    );


    showToast(
      'Could not load this restriction.',
      true
    );


    goRestrictionReturn();

  }

}



function getCheckedStores() {

  return Array.from(
    document.querySelectorAll(
      'input[name="allowedStore"]:checked'
    )
  )
  .map(
    checkbox =>
      checkbox.value
  );

}



restrictionForm
  .addEventListener(
    'submit',
    async event => {

      event.preventDefault();


      const itemName =
        normalizeItemName(
          restrictionItemName.value
        );


      const allowedStores =
        getCheckedStores();


      if (
        !itemName
      ) {

        showToast(
          'Please enter an item.',
          true
        );


        restrictionItemName.focus();


        return;

      }


      if (
        normalizedKey(
          itemName
        ) ===
        'case of water'
      ) {

        showToast(
          'Case of Water is permanently assigned to Sam’s / CostCo.',
          true
        );


        return;

      }


      if (
        !allowedStores.length
      ) {

        showToast(
          'Choose at least one allowed store.',
          true
        );


        return;

      }


      saveRestrictionButton.disabled =
        true;


      saveRestrictionButton.textContent =
        'Saving…';


      try {

        const result =
          unwrapRpcResult(

            await api(
              '/rest/v1/rpc/save_item_store_restriction',
              {
                method:
                  'POST',

                body:
                  JSON.stringify({
                    p_original_item_name:
                      editingRestrictionOriginalName,

                    p_item_name:
                      itemName,

                    p_allowed_stores:
                      allowedStores
                  })
              }
            )

          );


        if (
          result &&
          result.saved ===
            false
        ) {

          if (
            result.reason ===
            'restriction_exists'
          ) {

            showToast(
              'A restriction for that item already exists.',
              true
            );


            return;

          }


          if (
            result.reason ===
            'item_on_disallowed_store'
          ) {

            showToast(
              `${itemName} is currently on the ${STORES[result.existing_store] || 'another store'} list. Remove it from that list before applying this restriction.`,
              true
            );


            return;

          }


          if (
            result.reason ===
            'no_stores'
          ) {

            showToast(
              'Choose at least one allowed store.',
              true
            );


            return;

          }


          showToast(
            'Could not save the restriction.',
            true
          );


          return;

        }


        goRestrictionReturn();


        setTimeout(
          () => {

            showToast(
              `${itemName} restriction saved.`
            );

          },
          80
        );


      } catch (error) {

        console.error(
          error
        );


        showToast(
          'Could not save the restriction.',
          true
        );


      } finally {

        saveRestrictionButton.disabled =
          false;


        saveRestrictionButton.textContent =
          'Save Restriction';

      }

    }
  );



deleteRestrictionButton
  .addEventListener(
    'click',
    async () => {

      if (
        !editingRestrictionOriginalName
      ) {

        return;

      }


      const itemName =
        editingRestrictionOriginalName;


      if (
        !window.confirm(
          `Delete the restriction for ${itemName}?`
        )
      ) {

        return;

      }


      deleteRestrictionButton.disabled =
        true;


      deleteRestrictionButton.textContent =
        'Deleting…';


      try {

        const result =
          unwrapRpcResult(

            await api(
              '/rest/v1/rpc/delete_item_store_restriction',
              {
                method:
                  'POST',

                body:
                  JSON.stringify({
                    p_item_name:
                      itemName
                  })
              }
            )

          );


        if (
          !result ||
          result.deleted !==
            true
        ) {

          showToast(
            'Could not delete the restriction.',
            true
          );


          return;

        }


        goRestrictionReturn();


        setTimeout(
          () => {

            showToast(
              `${itemName} restriction deleted.`
            );

          },
          80
        );


      } catch (error) {

        console.error(
          error
        );


        showToast(
          'Could not delete the restriction.',
          true
        );


      } finally {

        deleteRestrictionButton.disabled =
          false;


        deleteRestrictionButton.textContent =
          'Delete Restriction';

      }

    }
  );



window.addEventListener(
  'hashchange',
  route
);



document.addEventListener(
  'visibilitychange',
  () => {

    if (
      document.hidden
    ) {

      return;

    }


    if (
      currentStore
    ) {

      loadStoreItems(
        true
      );


      return;

    }


    if (
      currentInventoryCategory &&
      location.hash.startsWith(
        '#inventory/'
      )
    ) {

      loadInventoryItems(
        true
      );


      return;

    }


    if (
      location.hash ===
      '#restrictions/items'
    ) {

      loadRestrictions();


      return;

    }


    if (
      currentRestrictionStore &&
      location.hash.startsWith(
        '#restrictions/store/'
      )
    ) {

      loadRestrictionsByStore(
        currentRestrictionStore
      );


      return;

    }


    if (
      location.hash ===
      '#home'
    ) {

      loadHomeCounts();

    }

  }
);



if (
  !location.hash
) {

  history.replaceState(
    null,
    '',
    '#home'
  );

}


route();

</script>
