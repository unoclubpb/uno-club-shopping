<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Uno Shopping">
  <title>Uno Club Shopping</title>

  <!-- Upload uno-club-shopping.png to the same GitHub repository as index.html. -->
  <link rel="icon" type="image/png" href="uno-club-shopping.png">
  <link rel="apple-touch-icon" href="uno-club-shopping.png">

  <style>
    :root {
      --black: #0b0b0b;
      --page: #f5f6f8;
      --white: #ffffff;
      --blue: #1e5acb;
      --blue-dark: #15459f;
      --blue-light: #79a5f4;
      --border: #d9d9d9;
      --text: #171717;
      --muted: #6b7280;
      --danger: #c62828;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    button, input, select {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .app-header {
      min-height: 82px;
      padding: calc(9px + env(safe-area-inset-top)) 14px 9px;
      background: var(--black);
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 10px rgba(0,0,0,.22);
    }

    .app-header h1 {
      flex: 1;
      margin: 0;
      text-align: left;
      white-space: pre-line;
      font-size: 23px;
      line-height: 1.02;
      font-weight: 850;
      letter-spacing: .1px;
    }

    .header-logo {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 4px 12px rgba(0,0,0,.35);
    }

    .back-button {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--white);
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-button:active { background: rgba(255,255,255,.12); }

    main {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 22px 16px calc(34px + env(safe-area-inset-bottom));
    }

    .screen[hidden] { display: none !important; }

    .button-stack {
      display: grid;
      gap: 13px;
    }

    .main-button,
    .save-button {
      width: 100%;
      min-height: 62px;
      border: 0;
      border-radius: 14px;
      background: var(--blue);
      color: var(--white);
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 5px 14px rgba(30,90,203,.24);
      cursor: pointer;
      transition: transform .08s ease, background .15s ease;
    }

    .main-button:active,
    .save-button:active {
      transform: scale(.985);
      background: var(--blue-dark);
    }

    .main-button.add-item {
      background: var(--black);
      box-shadow: 0 5px 14px rgba(0,0,0,.20);
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .form-card {
      padding: 18px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 15px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 54px;
      padding: 12px 13px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      color: var(--text);
      font-size: 18px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(30,90,203,.12);
    }

    .hint {
      margin: -9px 0 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .list-card {
      padding: 0;
    }

    .list-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 84px 48px;
      gap: 10px;
      padding: 12px 14px;
      background: #edf3ff;
      border-bottom: 1px solid var(--border);
      color: #364152;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .list-heading span:nth-child(2) { text-align: center; }

    .item-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 84px 48px;
      gap: 10px;
      align-items: center;
      min-height: 66px;
      padding: 9px 14px;
      border-bottom: 1px solid #ececec;
    }

    .item-row:last-child { border-bottom: 0; }

    .item-name {
      min-width: 0;
      font-size: 17px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .qty-input,
    .qty-fixed {
      width: 76px;
      min-height: 44px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--white);
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }

    .qty-input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(30,90,203,.12);
    }

    .qty-fixed {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f3f6;
      color: #515865;
    }

    .delete-button {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 11px;
      background: #fff1f1;
      color: var(--danger);
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-button:active { background: #ffdede; }
    .delete-button:disabled { opacity: .45; }

    .permanent-row {
      background: #f7faff;
    }

    .fixed-note {
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-top: 3px;
    }

    .empty-state,
    .loading-state,
    .error-state {
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 16px;
    }

    .error-state { color: var(--danger); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translate(-50%, 18px);
      width: min(calc(100% - 32px), 520px);
      padding: 13px 16px;
      border-radius: 12px;
      background: var(--black);
      color: var(--white);
      text-align: center;
      font-weight: 700;
      box-shadow: 0 8px 30px rgba(0,0,0,.26);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.error { background: #8f1d1d; }

    @media (max-width: 390px) {
      .item-row,
      .list-heading {
        grid-template-columns: minmax(0, 1fr) 72px 44px;
        gap: 7px;
        padding-left: 11px;
        padding-right: 11px;
      }
      .qty-input, .qty-fixed { width: 66px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <button id="backButton" class="back-button" type="button" aria-label="Back to main page" hidden>&larr;</button>
    <h1 id="pageTitle">Uno Club
Shopping</h1>
    <img class="header-logo" src="uno-club-shopping.png" alt="Uno Club Shopping logo">
  </header>

  <main>
    <section id="homeScreen" class="screen">
      <div class="button-stack">
        <button id="addItemButton" class="main-button add-item" type="button">Add Item</button>
        <button class="main-button store-button" type="button" data-store="sams_costco">Sam’s/Costco</button>
        <button class="main-button store-button" type="button" data-store="walmart">Walmart</button>
        <button class="main-button store-button" type="button" data-store="alcohol">Alcohol</button>
        <button class="main-button store-button" type="button" data-store="sodas">Sodas</button>
      </div>
    </section>

    <section id="addScreen" class="screen" hidden>
      <div class="card form-card">
        <form id="addItemForm">
          <div class="field">
            <label for="itemName">What item would you like to add?</label>
            <input id="itemName" name="itemName" type="text" maxlength="100" autocomplete="off" required>
          </div>

          <div class="field">
            <label for="quantity">Quantity</label>
            <input id="quantity" name="quantity" type="number" min="1" max="9999" step="1" inputmode="numeric" placeholder="1">
          </div>
          <div class="hint">If left blank, the quantity will be 1.</div>

          <div class="field">
            <label for="store">Store</label>
            <select id="store" name="store" required>
              <option value="" selected disabled>Choose a store</option>
              <option value="sams_costco">Sam’s/Costco</option>
              <option value="walmart">Walmart</option>
              <option value="alcohol">Alcohol</option>
              <option value="sodas">Sodas</option>
            </select>
          </div>

          <button id="saveItemButton" class="save-button" type="submit">Add Item</button>
        </form>
      </div>
    </section>

    <section id="storeScreen" class="screen" hidden>
      <div class="card list-card">
        <div class="list-heading" aria-hidden="true">
          <span>Item</span>
          <span>Qty</span>
          <span></span>
        </div>
        <div id="storeList" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';

    // Supabase project settings. The publishable key is designed for browser use.
    const SUPABASE_URL = 'https://yfchkrnuxaquqzxtcynp.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_gh0acghIDuQDgh24ZIm8Mw_c1bpvIM6';

    const STORES = {
      sams_costco: 'Sam’s/Costco',
      walmart: 'Walmart',
      alcohol: 'Alcohol',
      sodas: 'Sodas'
    };

    const homeScreen = document.getElementById('homeScreen');
    const addScreen = document.getElementById('addScreen');
    const storeScreen = document.getElementById('storeScreen');
    const pageTitle = document.getElementById('pageTitle');
    const backButton = document.getElementById('backButton');
    const addItemButton = document.getElementById('addItemButton');
    const addItemForm = document.getElementById('addItemForm');
    const itemNameInput = document.getElementById('itemName');
    const quantityInput = document.getElementById('quantity');
    const storeSelect = document.getElementById('store');
    const saveItemButton = document.getElementById('saveItemButton');
    const storeList = document.getElementById('storeList');
    const toast = document.getElementById('toast');

    let currentStore = null;
    let toastTimer = null;

    function showToast(message, isError = false) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.toggle('error', isError);
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function showOnly(screen) {
      homeScreen.hidden = screen !== homeScreen;
      addScreen.hidden = screen !== addScreen;
      storeScreen.hidden = screen !== storeScreen;
    }

    function goHome() {
      location.hash = '#home';
    }

    function goAdd() {
      location.hash = '#add';
    }

    function goStore(storeKey) {
      location.hash = '#store/' + storeKey;
    }

    function route() {
      const hash = location.hash || '#home';

      if (hash === '#add') {
        currentStore = null;
        showOnly(addScreen);
        pageTitle.textContent = 'Add Item';
        backButton.hidden = false;
        setTimeout(() => itemNameInput.focus(), 80);
        return;
      }

      if (hash.startsWith('#store/')) {
        const storeKey = hash.slice('#store/'.length);
        if (!STORES[storeKey]) {
          goHome();
          return;
        }
        currentStore = storeKey;
        showOnly(storeScreen);
        pageTitle.textContent = STORES[storeKey];
        backButton.hidden = false;
        loadStoreItems();
        return;
      }

      currentStore = null;
      showOnly(homeScreen);
      pageTitle.textContent = 'Uno Club\nShopping';
      backButton.hidden = true;
    }

    async function api(path, options = {}) {
      const headers = {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Accept: 'application/json',
        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        ...(options.headers || {})
      };

      const response = await fetch(SUPABASE_URL + path, {
        ...options,
        headers
      });

      if (!response.ok) {
        let message = `Request failed (${response.status})`;
        try {
          const data = await response.json();
          message = data.message || data.error_description || data.hint || message;
        } catch (_) {
          const text = await response.text();
          if (text) message = text;
        }
        throw new Error(message);
      }

      if (response.status === 204) return null;
      const text = await response.text();
      return text ? JSON.parse(text) : null;
    }

    function normalizeItemName(value) {
      return value.trim().replace(/\s+/g, ' ');
    }

    addItemButton.addEventListener('click', goAdd);

    document.querySelectorAll('.store-button').forEach(button => {
      button.addEventListener('click', () => goStore(button.dataset.store));
    });

    backButton.addEventListener('click', goHome);

    addItemForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const itemName = normalizeItemName(itemNameInput.value);
      const store = storeSelect.value;
      const rawQuantity = quantityInput.value.trim();
      const quantity = rawQuantity === '' ? 1 : Number.parseInt(rawQuantity, 10);

      if (!itemName) {
        showToast('Please enter an item.', true);
        itemNameInput.focus();
        return;
      }

      if (!store || !STORES[store]) {
        showToast('Please choose a store.', true);
        storeSelect.focus();
        return;
      }

      if (!Number.isInteger(quantity) || quantity < 1 || quantity > 9999) {
        showToast('Quantity must be a whole number of 1 or more.', true);
        quantityInput.focus();
        return;
      }

      if (store === 'sams_costco' && itemName.toLocaleLowerCase() === 'case of water') {
        showToast('Case of Water is already permanently on Sam’s/Costco.', true);
        return;
      }

      saveItemButton.disabled = true;
      saveItemButton.textContent = 'Adding…';

      try {
        await api('/rest/v1/shopping_items', {
          method: 'POST',
          headers: { Prefer: 'return=minimal' },
          body: JSON.stringify({
            item_name: itemName,
            quantity,
            store
          })
        });

        itemNameInput.value = '';
        quantityInput.value = '';
        showToast(`Added to ${STORES[store]}.`);
        itemNameInput.focus();
      } catch (error) {
        console.error(error);
        showToast('Could not add the item. Please try again.', true);
      } finally {
        saveItemButton.disabled = false;
        saveItemButton.textContent = 'Add Item';
      }
    });

    async function loadStoreItems(quiet = false) {
      if (!currentStore) return;
      const storeAtStart = currentStore;

      if (!quiet) {
        storeList.innerHTML = '<div class="loading-state">Loading…</div>';
      }

      try {
        const data = await api(
          '/rest/v1/shopping_items?select=id,item_name,quantity,store&store=eq.' + encodeURIComponent(storeAtStart)
        );

        if (currentStore !== storeAtStart) return;

        const items = Array.isArray(data) ? data : [];
        items.sort((a, b) =>
          a.item_name.localeCompare(b.item_name, undefined, { sensitivity: 'base', numeric: true })
        );

        renderStoreList(items);
      } catch (error) {
        console.error(error);
        if (!quiet && currentStore === storeAtStart) {
          storeList.innerHTML = '<div class="error-state">Could not load this list. Please try again.</div>';
        }
      }
    }

    function renderStoreList(items) {
      storeList.innerHTML = '';

      if (currentStore === 'sams_costco') {
        storeList.appendChild(createPermanentWaterRow());
      }

      items.forEach(item => storeList.appendChild(createItemRow(item)));

      if (items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = currentStore === 'sams_costco'
          ? 'No other items on this list.'
          : 'No items on this list.';
        storeList.appendChild(empty);
      }
    }

    function createPermanentWaterRow() {
      const row = document.createElement('div');
      row.className = 'item-row permanent-row';

      const nameWrap = document.createElement('div');
      const name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = 'Case of Water';
      const note = document.createElement('div');
      note.className = 'fixed-note';
      note.textContent = 'Always on list';
      nameWrap.append(name, note);

      const qty = document.createElement('div');
      qty.className = 'qty-fixed';
      qty.textContent = '1';
      qty.setAttribute('aria-label', 'Quantity 1');

      const spacer = document.createElement('div');
      spacer.setAttribute('aria-hidden', 'true');

      row.append(nameWrap, qty, spacer);
      return row;
    }

    function createItemRow(item) {
      const row = document.createElement('div');
      row.className = 'item-row db-row';
      row.dataset.id = item.id;

      const name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = item.item_name;

      const qty = document.createElement('input');
      qty.className = 'qty-input';
      qty.type = 'number';
      qty.min = '1';
      qty.max = '9999';
      qty.step = '1';
      qty.inputMode = 'numeric';
      qty.value = item.quantity;
      qty.setAttribute('aria-label', `Quantity for ${item.item_name}`);
      qty.dataset.savedValue = String(item.quantity);
      qty.addEventListener('focus', () => qty.select());
      qty.addEventListener('change', () => updateQuantity(item.id, qty));

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete-button';
      del.textContent = '×';
      del.setAttribute('aria-label', `Delete ${item.item_name}`);
      del.addEventListener('click', () => deleteItem(item.id, item.item_name, row, del));

      row.append(name, qty, del);
      return row;
    }

    async function updateQuantity(id, input) {
      const oldValue = Number.parseInt(input.dataset.savedValue, 10);
      const newValue = Number.parseInt(input.value, 10);

      if (!Number.isInteger(newValue) || newValue < 1 || newValue > 9999) {
        input.value = oldValue;
        showToast('Quantity must be a whole number of 1 or more.', true);
        return;
      }

      if (newValue === oldValue) return;

      input.disabled = true;

      try {
        await api('/rest/v1/shopping_items?id=eq.' + encodeURIComponent(id), {
          method: 'PATCH',
          headers: { Prefer: 'return=minimal' },
          body: JSON.stringify({ quantity: newValue })
        });
        input.dataset.savedValue = String(newValue);
        showToast('Quantity updated.');
      } catch (error) {
        console.error(error);
        input.value = oldValue;
        showToast('Could not update the quantity.', true);
      } finally {
        input.disabled = false;
      }
    }

    async function deleteItem(id, itemName, row, button) {
      button.disabled = true;

      try {
        await api('/rest/v1/shopping_items?id=eq.' + encodeURIComponent(id), {
          method: 'DELETE',
          headers: { Prefer: 'return=minimal' }
        });

        row.remove();
        showToast(`${itemName} removed.`);

        if (!storeList.querySelector('.db-row')) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = currentStore === 'sams_costco'
            ? 'No other items on this list.'
            : 'No items on this list.';
          storeList.appendChild(empty);
        }
      } catch (error) {
        console.error(error);
        button.disabled = false;
        showToast('Could not remove the item.', true);
      }
    }

    window.addEventListener('hashchange', route);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && currentStore) {
        loadStoreItems(true);
      }
    });

    if (!location.hash) {
      history.replaceState(null, '', '#home');
    }
    route();
  </script>
</body>
</html>
