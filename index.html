<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="app-version" content="1.0.30">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Uno Club Shopping</title>
<link rel="icon" type="image/png" href="uno-club-shopping.PNG?v=1.0.30">
<link rel="apple-touch-icon" href="uno-club-shopping.PNG?v=1.0.30">

<style>
:root{
  --black:#0b0b0b;--page:#f5f6f8;--white:#fff;--blue:#1e5acb;--blue-dark:#15459f;
  --green:#218c4f;--green-dark:#176b3a;--red:#c62828;--red-dark:#991f1f;
  --border:#d9d9d9;--text:#171717;--muted:#6b7280;--danger:#c62828;
  --shadow:0 8px 24px rgba(0,0,0,.10);--radius:16px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button,input,select{font:inherit}button{touch-action:manipulation}
.app-header{height:calc(82px + env(safe-area-inset-top));padding:calc(9px + env(safe-area-inset-top)) 14px 9px;background:var(--black);color:var(--white);display:flex;align-items:center;gap:10px;position:fixed;inset:0 0 auto 0;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.app-header h1{flex:1;min-width:0;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:22px;line-height:1.1;font-weight:850}
.header-logo{width:58px;height:58px;flex:0 0 58px;object-fit:cover;border-radius:12px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 4px 12px rgba(0,0,0,.35)}
.back-button{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:12px;background:transparent;color:var(--white);font-size:32px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.back-button[hidden]{display:none!important}.back-button:active{background:rgba(255,255,255,.12)}
main{width:min(100%,620px);margin:0 auto;padding:calc(104px + env(safe-area-inset-top)) 16px calc(42px + env(safe-area-inset-bottom))}
.screen[hidden]{display:none!important}
#homeScreen:not([hidden]){display:flex;flex-direction:column;min-height:calc(100dvh - 155px - env(safe-area-inset-top))}
.button-stack,.category-stack,.home-bottom-menu{display:grid;gap:13px}
.home-bottom-menu{margin-top:auto;padding-top:22px;margin-bottom:24px}
.main-button,.save-button{width:100%;min-height:62px;border:2px solid var(--black);border-radius:14px;background:var(--blue);color:var(--white);font-size:20px;font-weight:800;box-shadow:0 5px 14px rgba(30,90,203,.24);cursor:pointer;transition:transform .08s ease,background .15s ease}
.main-button:active,.save-button:active{transform:scale(.985);background:var(--blue-dark)}
.main-button.add-item,.store-add-button,.inventory-add-button{background:var(--black);box-shadow:0 5px 14px rgba(0,0,0,.20)}
.store-button{position:relative}.store-add-button,.inventory-add-button{margin-bottom:13px}.secondary-menu-button{min-height:54px;font-size:17px}
#inventoryButton{background:var(--green);box-shadow:0 5px 14px rgba(33,140,79,.24)}#inventoryButton:active{background:var(--green-dark)}
#adminButton{background:var(--red);box-shadow:0 5px 14px rgba(198,40,40,.24)}#adminButton:active{background:var(--red-dark)}
.count-badge{position:absolute;top:7px;right:8px;min-width:29px;height:29px;padding:0 7px;border-radius:15px;background:var(--white);color:var(--blue);border:2px solid var(--black);font-size:15px;font-weight:900;line-height:25px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.18);pointer-events:none}
.version-label{position:fixed;left:10px;bottom:calc(7px + env(safe-area-inset-bottom));color:#000;font-size:11px;font-weight:500;z-index:10;pointer-events:none}
.card,.restriction-list,.master-list{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.form-card{padding:18px}.field{margin-bottom:18px}.field label,.field-label{display:block;margin-bottom:7px;font-size:15px;font-weight:800}
.field input,.field select{width:100%;min-height:54px;padding:12px 13px;border:1.5px solid var(--border);border-radius:12px;background:var(--white);color:var(--text);font-size:18px;outline:none}
.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,90,203,.12)}
.field select:disabled,.field input[readonly]{opacity:1;background:#eee;color:#4b5563;-webkit-text-fill-color:#4b5563;border-color:#b8b8b8}
.readonly-value{width:100%;min-height:54px;padding:14px 13px;border:1.5px solid var(--border);border-radius:12px;background:#f1f3f6;color:var(--text);font-size:18px;font-weight:700;display:flex;align-items:center}
.locked-note,.form-note{margin-top:7px;color:var(--muted);font-size:13px;font-weight:650}.locked-note[hidden]{display:none!important}
.autocomplete-wrap{position:relative}.autocomplete-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:1500;background:var(--white);border:1.5px solid var(--border);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.16);max-height:260px;overflow-y:auto}.autocomplete-list[hidden]{display:none!important}
.autocomplete-option{width:100%;border:0;border-bottom:1px solid #ececec;background:var(--white);padding:12px 13px;text-align:left;color:var(--text);font-size:17px;font-weight:700;cursor:pointer}.autocomplete-option:last-child{border-bottom:0}.autocomplete-option:active{background:#edf3ff}
.autocomplete-empty{padding:14px 13px;color:var(--muted);font-size:16px;font-weight:700;text-align:left}
.inventory-search-card,.master-search-card{margin-bottom:13px;padding:16px;overflow:visible}.inventory-search-card .field,.master-search-card .field{margin-bottom:0}.master-add-button{margin-bottom:13px}.restriction-shopping-button{min-height:54px;margin-top:14px;font-size:18px}.restriction-shopping-button[hidden]{display:none!important}
.qty-control{display:flex;align-items:center;justify-content:center;gap:5px}.qty-step-button{width:36px;height:44px;flex:0 0 36px;border:2px solid var(--black);border-radius:10px;background:var(--white);color:var(--black);font-size:24px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}.qty-step-button:active{background:#e7e7e7}.qty-step-button:disabled{opacity:.35}
.qty-input{width:48px;min-height:44px;padding:4px;border:1.5px solid var(--border);border-radius:10px;background:var(--white);color:var(--text);text-align:center;font-size:18px;font-weight:800;outline:none;-moz-appearance:textfield}.qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.qty-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,90,203,.12)}
.add-qty-control{justify-content:flex-start}.add-qty-control .qty-step-button{width:48px;height:52px;flex:0 0 48px}.add-qty-control .qty-input{width:76px;min-height:52px;font-size:20px}
.list-card{padding:0}.list-heading,.item-row{display:grid;grid-template-columns:minmax(0,1fr) 132px 48px;gap:8px;align-items:center}.list-heading{padding:12px 14px;background:#edf3ff;border-bottom:1px solid var(--border);color:#364152;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.7px}.list-heading span:nth-child(2){text-align:center}.item-row{min-height:66px;padding:9px 14px;border-bottom:1px solid #ececec}.item-row:last-child{border-bottom:0}
.item-name{min-width:0;font-size:17px;font-weight:750;overflow-wrap:anywhere}.clickable-item-name{min-width:0;max-width:100%;border:0;margin:0;padding:0;background:transparent;color:var(--blue);font-size:17px;font-weight:750;text-align:left;overflow-wrap:anywhere;cursor:pointer}.clickable-item-name:active{color:var(--blue-dark)}
.qty-fixed{width:48px;min-height:44px;margin:0 auto;border:1.5px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f1f3f6;color:#515865;font-size:18px;font-weight:800}
.delete-button{width:44px;height:44px;border:2px solid var(--black);border-radius:11px;background:#fff1f1;color:var(--danger);font-size:28px;line-height:1;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}.delete-button:active{background:#ffdede}.delete-button:disabled{opacity:.45}
.permanent-row{background:#f7faff}.fixed-note{color:var(--blue);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.category-button{text-align:left;padding:0 18px}.category-button::after{content:'›';float:right;font-size:29px;font-weight:500;line-height:24px}
.inventory-category-note{margin:0 0 13px;color:var(--muted);font-size:13px;font-weight:650;text-align:center}.restrictions-toolbar{margin-bottom:13px}
.restriction-row{width:100%;border:0;border-bottom:1px solid #ececec;background:var(--white);color:var(--text);padding:14px 15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;cursor:pointer}.restriction-row:last-child{border-bottom:0}.restriction-row:active{background:#edf3ff}.restriction-name{font-size:17px;font-weight:800;overflow-wrap:anywhere}.restriction-stores{margin-top:4px;color:var(--muted);font-size:13px;font-weight:650}.restriction-chevron{color:var(--blue);font-size:30px;line-height:1;font-weight:500}
.store-checks{display:grid;gap:9px}.store-check-row{min-height:50px;padding:8px 12px;border:1.5px solid var(--border);border-radius:12px;background:#fafafa;display:flex!important;align-items:center;gap:11px;cursor:pointer;font-size:17px!important;font-weight:700!important}.store-check-row input{width:23px;height:23px;margin:0;accent-color:var(--blue)}
.delete-restriction-button{width:100%;min-height:54px;margin-top:14px;border:2px solid var(--black);border-radius:14px;background:#fff1f1;color:var(--danger);font-size:18px;font-weight:850;cursor:pointer}.delete-restriction-button[hidden]{display:none!important}.delete-restriction-button:active{background:#ffdede}
.master-row{min-height:60px;padding:8px 10px 8px 15px;border-bottom:1px solid #ececec;display:grid;grid-template-columns:minmax(0,1fr) 44px 48px;gap:8px;align-items:center}.master-row.has-restriction{box-shadow:inset 0 0 0 2px var(--blue);border-radius:10px}.master-row:last-child{border-bottom:0}.master-name-button{border:0;background:transparent;color:var(--blue);padding:8px 0;text-align:left;font-size:17px;font-weight:800;cursor:pointer;overflow-wrap:anywhere}.master-name-button:active{color:var(--blue-dark)}.master-qty{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:850;color:var(--text)}
.empty-state,.loading-state,.error-state{padding:28px 18px;text-align:center;color:var(--muted);font-size:16px}.error-state{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,18px);width:min(calc(100% - 32px),520px);min-height:52px;padding:9px 10px 9px 16px;border-radius:12px;background:var(--black);color:var(--white);display:flex;align-items:center;justify-content:center;gap:14px;text-align:center;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.26);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:2000}.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast.error{background:#8f1d1d}.toast-message{min-width:0}.toast-undo-button{flex:0 0 auto;min-height:36px;padding:6px 12px;border:1.5px solid var(--white);border-radius:9px;background:transparent;color:var(--white);font-size:14px;font-weight:900;cursor:pointer}.toast-undo-button[hidden]{display:none!important}.toast-undo-button:active{background:rgba(255,255,255,.18)}.toast-undo-button:disabled{opacity:.5}
@media(max-width:390px){.app-header h1{font-size:19px}.list-heading,.item-row{grid-template-columns:minmax(0,1fr) 124px 44px;gap:5px;padding-left:10px;padding-right:10px}.qty-step-button{width:34px;flex-basis:34px}.qty-input{width:44px}}
</style>
</head>
<body>

<header class="app-header">
  <button id="backButton" class="back-button" type="button" aria-label="Back" hidden>&larr;</button>
  <h1 id="pageTitle">Uno Club Shopping</h1>
  <img class="header-logo" src="uno-club-shopping.PNG?v=1.0.30" alt="Uno Club Shopping logo">
</header>

<main>
  <section id="homeScreen" class="screen">
    <div class="button-stack">
      <button id="addItemButton" class="main-button add-item" type="button">Add Item</button>
      <button class="main-button store-button" type="button" data-store="sams_costco">Sam’s / CostCo<span class="count-badge" data-count-store="sams_costco">1</span></button>
      <button class="main-button store-button" type="button" data-store="walmart">Walmart<span class="count-badge" data-count-store="walmart">0</span></button>
      <button class="main-button store-button" type="button" data-store="alcohol">Alcohol<span class="count-badge" data-count-store="alcohol">0</span></button>
      <button class="main-button store-button" type="button" data-store="sodas">Sodas<span class="count-badge" data-count-store="sodas">0</span></button>
      <button class="main-button store-button" type="button" data-store="amazon">Amazon<span class="count-badge" data-count-store="amazon">0</span></button>
    </div>
    <div class="home-bottom-menu">
      <button id="inventoryButton" class="main-button secondary-menu-button" type="button">Inventory</button>
      <button id="adminButton" class="main-button secondary-menu-button" type="button">Admin</button>
    </div>
    <div class="version-label">v1.0.30</div>
  </section>

  <section id="addScreen" class="screen" hidden>
    <div class="card form-card">
      <form id="addItemForm">
        <div class="field">
          <label for="itemName">What item would you like to add?</label>
          <div class="autocomplete-wrap">
            <input id="itemName" type="text" maxlength="100" autocomplete="off" required>
            <div id="itemNameSuggestions" class="autocomplete-list" hidden></div>
          </div>
        </div>
        <div class="field">
          <label>Quantity</label>
          <div class="qty-control add-qty-control">
            <button id="addQtyMinus" class="qty-step-button" type="button">−</button>
            <input id="quantity" class="qty-input" type="number" min="1" max="9999" step="1" inputmode="numeric" value="1">
            <button id="addQtyPlus" class="qty-step-button" type="button">+</button>
          </div>
        </div>
        <div class="field">
          <label for="store">Store</label>
          <select id="store" required></select>
          <div id="lockedStoreNote" class="locked-note" hidden>This item will be added to this store.</div>
        </div>
        <button id="saveItemButton" class="save-button" type="submit">Add Item</button>
      </form>
    </div>
  </section>

  <section id="storeScreen" class="screen" hidden>
    <button id="storeAddItemButton" class="main-button store-add-button" type="button">Add Item</button>
    <div class="card list-card">
      <div class="list-heading"><span>Item</span><span>Qty</span><span></span></div>
      <div id="storeList"></div>
    </div>
  </section>

  <section id="shoppingMoveScreen" class="screen" hidden>
    <div class="card form-card">
      <form id="moveShoppingForm">
        <div class="field"><div class="field-label">Item</div><div id="moveItemName" class="readonly-value"></div></div>
        <div class="field"><div class="field-label">Current Store</div><div id="moveCurrentStore" class="readonly-value"></div></div>
        <div class="field"><label for="moveStoreSelect">Move To</label><select id="moveStoreSelect" required></select></div>
        <button id="saveMoveButton" class="save-button" type="submit">Move Item</button>
      </form>
    </div>
  </section>

  <section id="inventoryScreen" class="screen" hidden>
    <div class="card inventory-search-card">
      <div class="field">
        <label for="inventorySearchInput">Search Inventory</label>
        <div class="autocomplete-wrap">
          <input id="inventorySearchInput" type="text" maxlength="100" autocomplete="off" placeholder="Start typing an item">
          <div id="inventorySearchSuggestions" class="autocomplete-list" hidden></div>
        </div>
      </div>
    </div>
    <div id="inventoryCategoryButtons" class="category-stack"></div>
  </section>

  <section id="inventoryCategoryScreen" class="screen" hidden>
    <button id="inventoryAddItemButton" class="main-button inventory-add-button" type="button">Add Item</button>
    <div class="card list-card">
      <div class="list-heading"><span>Item</span><span>Qty</span><span></span></div>
      <div id="inventoryList"></div>
    </div>
  </section>

  <section id="inventoryAddScreen" class="screen" hidden>
    <div class="card form-card">
      <form id="inventoryAddForm">
        <div class="field">
          <label for="inventoryItemName">Item</label>
          <div class="autocomplete-wrap">
            <input id="inventoryItemName" type="text" maxlength="100" autocomplete="off" required>
            <div id="inventoryItemSuggestions" class="autocomplete-list" hidden></div>
          </div>
        </div>
        <div class="field">
          <label>Quantity in Stock</label>
          <div class="qty-control add-qty-control">
            <button id="inventoryQtyMinus" class="qty-step-button" type="button">−</button>
            <input id="inventoryQuantity" class="qty-input" type="number" min="0" max="9999" step="1" inputmode="numeric" value="1">
            <button id="inventoryQtyPlus" class="qty-step-button" type="button">+</button>
          </div>
        </div>
        <div id="inventoryCategoryNote" class="inventory-category-note"></div>
        <button id="saveInventoryItemButton" class="save-button" type="submit">Add to Inventory</button>
      </form>
    </div>
  </section>

  <section id="adminScreen" class="screen" hidden>
    <div class="category-stack">
      <button id="adminRestrictionsButton" class="main-button category-button" type="button">Manage Restrictions</button>
      <button id="masterListButton" class="main-button category-button" type="button">Master List</button>
    </div>
  </section>

  <section id="masterListScreen" class="screen" hidden>
    <button id="masterAddItemButton" class="main-button add-item master-add-button" type="button">Add Item</button>

    <div class="card master-search-card">
      <div class="field">
        <label for="masterSearchInput">Search Master List</label>
        <div class="autocomplete-wrap">
          <input id="masterSearchInput" type="text" maxlength="100" autocomplete="off" placeholder="Start typing an item">
          <div id="masterSearchSuggestions" class="autocomplete-list" hidden></div>
        </div>
      </div>
    </div>
    <div id="masterList" class="master-list"></div>
  </section>

  <section id="masterAddScreen" class="screen" hidden>
    <div class="card form-card">
      <form id="masterAddForm">
        <div class="field">
          <label for="masterAddItemName">Item</label>
          <input id="masterAddItemName" type="text" maxlength="100" autocomplete="off" required>
        </div>
        <button id="saveMasterItemButton" class="save-button" type="submit">Add to Master List</button>
      </form>
    </div>
  </section>

  <section id="restrictionsScreen" class="screen" hidden>
    <div class="category-stack">
      <button id="restrictionsByItemButton" class="main-button category-button" type="button">By Item</button>
      <button id="restrictionsByStoreButton" class="main-button category-button" type="button">By Store</button>
    </div>
  </section>

  <section id="restrictionsByItemScreen" class="screen" hidden>
    <div class="restrictions-toolbar"><button id="addRestrictionButton" class="main-button add-item" type="button">Add Restriction</button></div>
    <div id="restrictionList" class="restriction-list"></div>
  </section>

  <section id="restrictionsByStoreScreen" class="screen" hidden><div id="restrictionStoreButtons" class="category-stack"></div></section>

  <section id="restrictionStoreScreen" class="screen" hidden><div id="restrictionStoreList" class="restriction-list"></div></section>

  <section id="restrictionEditScreen" class="screen" hidden>
    <div class="card form-card">
      <form id="restrictionForm">
        <div class="field">
          <label for="restrictionItemName">Item</label>
          <div class="autocomplete-wrap">
            <input id="restrictionItemName" type="text" maxlength="100" autocomplete="off" required>
            <div id="restrictionItemSuggestions" class="autocomplete-list" hidden></div>
          </div>
        </div>
        <div class="field">
          <div class="field-label">Allowed Stores</div>
          <div class="store-checks">
            <label class="store-check-row"><input type="checkbox" name="allowedStore" value="sams_costco"><span>Sam’s / CostCo</span></label>
            <label class="store-check-row"><input type="checkbox" name="allowedStore" value="walmart"><span>Walmart</span></label>
            <label class="store-check-row"><input type="checkbox" name="allowedStore" value="alcohol"><span>Alcohol</span></label>
            <label class="store-check-row"><input type="checkbox" name="allowedStore" value="sodas"><span>Sodas</span></label>
            <label class="store-check-row"><input type="checkbox" name="allowedStore" value="amazon"><span>Amazon</span></label>
          </div>
          <div class="form-note">Check every store where this item is allowed.</div>
        </div>
        <button id="saveRestrictionButton" class="save-button" type="submit">Save Restriction</button>
        <button id="addRestrictionItemToShoppingButton" class="main-button add-item restriction-shopping-button" type="button" hidden>Add to Shopping List</button>
        <button id="deleteRestrictionButton" class="delete-restriction-button" type="button" hidden>Delete Restriction</button>
      </form>
    </div>
  </section>
</main>

<div id="toast" class="toast"><span id="toastMessage" class="toast-message"></span><button id="toastUndoButton" class="toast-undo-button" type="button" hidden>UNDO</button></div>

<script>
'use strict';

const APP_VERSION='1.0.30';
console.info(`Uno Club Shopping v${APP_VERSION}`);

const SUPABASE_URL='https://yfchkrnuxaquqzxtcynp.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_gh0acghIDuQDgh24ZIm8Mw_c1bpvIM6';
const STORES={sams_costco:'Sam’s / CostCo',walmart:'Walmart',alcohol:'Alcohol',sodas:'Sodas',amazon:'Amazon'};

function normalizeItemName(value){return String(value??'').trim().replace(/\s+/g,' ')}
function normalizedKey(value){return normalizeItemName(value).toLocaleLowerCase()}
function unwrapRpcResult(result){return Array.isArray(result)?result[0]:result}
function sortByName(items){return items.sort((a,b)=>a.item_name.localeCompare(b.item_name,undefined,{sensitivity:'base',numeric:true}))}
function rememberLastStore(store){if(!STORES[store])return;try{localStorage.setItem(LAST_STORE_KEY,store)}catch(_){}}
function getLastStore(){try{const s=localStorage.getItem(LAST_STORE_KEY);return s&&STORES[s]?s:null}catch(_){return null}}

async function api(path,options={}){
  const headers={apikey:SUPABASE_PUBLISHABLE_KEY,Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})};
  const response=await fetch(SUPABASE_URL+path,{...options,headers});
  if(!response.ok){
    let message=`Request failed (${response.status})`;
    try{const data=await response.json();message=data.message||data.error_description||data.hint||message}catch(_){const text=await response.text();if(text)message=text}
    throw new Error(message);
  }
  if(response.status===204)return null;
  const text=await response.text();return text?JSON.parse(text):null;
}

function showToast(message,isError=false,duration=3200){
  clearTimeout(toastTimer);pendingUndo=null;toastMessage.textContent=message;toastUndoButton.hidden=true;toastUndoButton.disabled=false;toast.classList.toggle('error',isError);toast.classList.add('show');
  toastTimer=setTimeout(()=>toast.classList.remove('show'),duration);
}

function showUndoToast(item,type){
  clearTimeout(toastTimer);pendingUndo={type,item:{...item}};toastMessage.textContent=`${item.item_name} removed`;toast.classList.remove('error');toastUndoButton.hidden=false;toastUndoButton.disabled=false;toastUndoButton.textContent='UNDO';toast.classList.add('show');
  toastTimer=setTimeout(()=>{pendingUndo=null;toastUndoButton.hidden=true;toast.classList.remove('show')},5000);
}

toastUndoButton.addEventListener('click',async()=>{
  if(!pendingUndo)return;
  const undo={...pendingUndo,item:{...pendingUndo.item}};clearTimeout(toastTimer);pendingUndo=null;toastUndoButton.disabled=true;toastUndoButton.hidden=true;toastMessage.textContent=`Restoring ${undo.item.item_name}…`;
  try{
    let result;
    if(undo.type==='shopping'){
      result=unwrapRpcResult(await api('/rest/v1/rpc/add_shopping_item',{method:'POST',body:JSON.stringify({p_item_name:undo.item.item_name,p_quantity:undo.item.quantity,p_store:undo.item.store})}));
      if(result?.added===true){invalidateMasterItems();if(currentStore===undo.item.store)await loadStoreItems(true);loadHomeCounts();showToast(`${undo.item.item_name} restored to ${STORES[undo.item.store]}.`);return}
    }else if(undo.type==='inventory'){
      result=unwrapRpcResult(await api('/rest/v1/rpc/add_inventory_item',{method:'POST',body:JSON.stringify({p_item_name:undo.item.item_name,p_quantity:undo.item.quantity,p_category:undo.item.category})}));
      if(result?.added===true){invalidateMasterItems();invalidateInventorySearch();if(currentInventoryCategory===undo.item.category)await loadInventoryItems(true);showToast(`${undo.item.item_name} restored to ${INVENTORY_CATEGORIES[undo.item.category]}.`);return}
    }
    if(result?.reason==='duplicate'){showToast(`${undo.item.item_name} is already on a list.`,true);return}
    showToast(`Could not restore ${undo.item.item_name}.`,true);
  }catch(error){console.error(error);showToast(`Could not restore ${undo.item.item_name}.`,true)}
});

async function fetchMasterItems(force=false){
  if(masterItemsCache&&!force)return masterItemsCache;
  const data=await api('/rest/v1/master_items?select=id,item_name');
  masterItemsCache=sortByName(Array.isArray(data)?data:[]);
  return masterItemsCache;
}

function hideSuggestions(box){box.hidden=true;box.innerHTML=''}
async function renderAutocomplete(input,box,onPick){
  if(input.readOnly||input.disabled){hideSuggestions(box);return}
  const query=normalizedKey(input.value);
  if(!query){hideSuggestions(box);return}
  try{
    const items=await fetchMasterItems();
    if(document.activeElement!==input){hideSuggestions(box);return}
    const matches=items.filter(x=>normalizedKey(x.item_name).includes(query)).slice(0,8);
    if(!matches.length){hideSuggestions(box);return}
    box.innerHTML='';
    matches.forEach(item=>{
      const button=document.createElement('button');button.type='button';button.className='autocomplete-option';button.textContent=item.item_name;
      button.addEventListener('mousedown',e=>e.preventDefault());
      button.addEventListener('click',()=>{input.value=item.item_name;hideSuggestions(box);if(onPick)onPick(item.item_name);input.focus()});
      box.appendChild(button);
    });
    box.hidden=false;
  }catch(error){console.error(error);hideSuggestions(box)}
}

function setupAutocomplete(input,box,onPick){
  const update=()=>renderAutocomplete(input,box,onPick);
  input.addEventListener('input',update);input.addEventListener('focus',update);input.addEventListener('blur',()=>setTimeout(()=>hideSuggestions(box),180));
}

function rebuildStoreOptions(storeKeys,selectedStore=''){
  storeSelect.innerHTML='';const p=document.createElement('option');p.value='';p.textContent='Choose a store';p.disabled=true;storeSelect.appendChild(p);
  storeKeys.forEach(key=>{if(!STORES[key])return;const o=document.createElement('option');o.value=key;o.textContent=STORES[key];storeSelect.appendChild(o)});
  storeSelect.value=selectedStore&&storeKeys.includes(selectedStore)?selectedStore:'';
}

async function fetchRestrictionRows(){const data=await api('/rest/v1/item_store_restrictions?select=item_name,allowed_store');return Array.isArray(data)?data:[]}
function getAllowedStoresForItemName(itemName,rows){
  if(!Array.isArray(rows))return null;const key=normalizedKey(itemName);const matches=rows.filter(r=>normalizedKey(r.item_name)===key);
  if(!matches.length)return Object.keys(STORES);const set=new Set(matches.map(r=>r.allowed_store));return Object.keys(STORES).filter(s=>set.has(s));
}

async function refreshStoreChoicesForItem(preferBlank=false){
  if(lockedAddStore){rebuildStoreOptions([lockedAddStore],lockedAddStore);return}
  const itemName=normalizeItemName(itemNameInput.value),previous=storeSelect.value,request=++storeRestrictionRequestNumber;
  if(!itemName){rebuildStoreOptions(Object.keys(STORES),preferBlank?'':(previous||getLastStore()||''));return}
  try{
    const rows=await fetchRestrictionRows();if(request!==storeRestrictionRequestNumber)return;
    const allowed=getAllowedStoresForItemName(itemName,rows);let selected='';
    if(allowed.length===1)selected=allowed[0];else if(!preferBlank&&previous&&allowed.includes(previous))selected=previous;else if(!preferBlank){const last=getLastStore();if(last&&allowed.includes(last))selected=last}
    rebuildStoreOptions(allowed,selected);
  }catch(error){console.error(error);if(request!==storeRestrictionRequestNumber)return;rebuildStoreOptions(Object.keys(STORES),preferBlank?'':(previous||getLastStore()||''))}
}

function route(){
  const hash=location.hash||'#home';currentInventoryCategory=null;currentRestrictionStore=null;clearTimeout(storeRestrictionTimer);

  if(hash.startsWith('#shopping/move/')){
    const id=decodeURIComponent(hash.slice('#shopping/move/'.length));currentStore=null;lockedAddStore=null;showOnly(shoppingMoveScreen);pageTitle.textContent='Move Item';backButton.hidden=false;loadShoppingItemForMove(id);return;
  }

  if(hash.startsWith('#add/')){
    const store=hash.slice(5);if(!STORES[store]){goHome();return}movingShoppingItem=null;pendingShoppingPrefillName=null;lockedAddStore=store;currentStore=null;showOnly(addScreen);pageTitle.textContent='Add Item';backButton.hidden=false;storeSelect.disabled=true;lockedStoreNote.hidden=false;rebuildStoreOptions([store],store);setAddQuantity(1);setTimeout(()=>itemNameInput.focus(),80);return;
  }

  if(hash==='#add'){
    movingShoppingItem=null;const prefill=pendingShoppingPrefillName;pendingShoppingPrefillName=null;lockedAddStore=null;currentStore=null;showOnly(addScreen);pageTitle.textContent='Add Item';backButton.hidden=false;storeSelect.disabled=false;lockedStoreNote.hidden=true;setAddQuantity(1);
    if(prefill){itemNameInput.value=prefill;rebuildStoreOptions(Object.keys(STORES),'');refreshStoreChoicesForItem(true)}
    else{rebuildStoreOptions(Object.keys(STORES),getLastStore()||'');if(normalizeItemName(itemNameInput.value))refreshStoreChoicesForItem(false)}
    setTimeout(()=>prefill?storeSelect.focus():itemNameInput.focus(),80);return;
  }

  if(hash.startsWith('#store/')){
    const store=hash.slice(7);if(!STORES[store]){goHome();return}movingShoppingItem=null;lockedAddStore=null;currentStore=store;showOnly(storeScreen);pageTitle.textContent=STORES[store];backButton.hidden=false;loadStoreItems();return;
  }

  if(hash==='#inventory'){
    movingShoppingItem=null;currentStore=null;lockedAddStore=null;showOnly(inventoryScreen);pageTitle.textContent='Inventory';backButton.hidden=false;inventorySearchInput.value='';hideSuggestions(inventorySearchSuggestions);renderInventoryCategories();fetchInventorySearchItems(true).catch(error=>console.error(error));return;
  }

  if(hash.startsWith('#inventory-add/')){
    const category=hash.slice('#inventory-add/'.length);if(!INVENTORY_CATEGORIES[category]){goInventory();return}movingShoppingItem=null;currentStore=null;lockedAddStore=null;currentInventoryCategory=category;showOnly(inventoryAddScreen);pageTitle.textContent='Add Inventory Item';backButton.hidden=false;inventoryItemName.value='';hideSuggestions(inventoryItemSuggestions);setInventoryAddQuantity(1);inventoryCategoryNote.textContent=`Category: ${INVENTORY_CATEGORIES[category]}`;setTimeout(()=>inventoryItemName.focus(),80);return;
  }

  if(hash.startsWith('#inventory/')){
    const category=hash.slice('#inventory/'.length);if(!INVENTORY_CATEGORIES[category]){goInventory();return}movingShoppingItem=null;currentStore=null;lockedAddStore=null;currentInventoryCategory=category;showOnly(inventoryCategoryScreen);pageTitle.textContent=INVENTORY_CATEGORIES[category];backButton.hidden=false;loadInventoryItems();return;
  }

  if(hash==='#admin'){
    movingShoppingItem=null;currentStore=null;lockedAddStore=null;showOnly(adminScreen);pageTitle.textContent='Admin';backButton.hidden=false;return;
  }

  if(hash==='#master/add'){
    movingShoppingItem=null;currentStore=null;lockedAddStore=null;restrictionFromMaster=false;showOnly(masterAddScreen);pageTitle.textContent='Add Master Item';backButton.hidden=false;masterAddItemName.value=pendingMasterAddName||'';pendingMasterAddName=null;setTimeout(()=>masterAddItemName.focus(),80);return;
  }

  if(hash.startsWith('#master/restriction/')){
    let name='';try{name=decodeURIComponent(hash.slice('#master/restriction/'.length))}catch(_){goMasterList();return}
    movingShoppingItem=null;currentStore=null;lockedAddStore=null;restrictionFromMaster=true;restrictionReturnHash='#master';showOnly(restrictionEditScreen);pageTitle.textContent='Item Restrictions';backButton.hidden=false;loadMasterItemRestriction(name);return;
  }

  if(hash==='#master'){
    movingShoppingItem=null;currentStore=null;lockedAddStore=null;restrictionFromMaster=false;showOnly(masterListScreen);pageTitle.textContent='Master List';backButton.hidden=false;masterSearchInput.value='';hideSuggestions(masterSearchSuggestions);loadMasterList();return;
  }

  if(hash==='#restrictions/items'){
    movingShoppingItem=null;currentStore=null;lockedAddStore=null;editingRestrictionOriginalName=null;restrictionFromMaster=false;showOnly(restrictionsByItemScreen);pageTitle.textContent='Restrictions by Item';backButton.hidden=false;loadRestrictions();return;
  }

  if(hash==='#restrictions/stores'){
    movingShoppingItem=null;currentStore=null;lockedAddStore=null;editingRestrictionOriginalName=null;restrictionFromMaster=false;showOnly(restrictionsByStoreScreen);pageTitle.textContent='Restrictions by Store';backButton.hidden=false;renderRestrictionStores();return;
  }

  if(hash.startsWith('#restrictions/store/')){
    const store=hash.slice('#restrictions/store/'.length);if(!STORES[store]){goRestrictionsByStore();return}movingShoppingItem=null;currentStore=null;lockedAddStore=null;editingRestrictionOriginalName=null;restrictionFromMaster=false;currentRestrictionStore=store;showOnly(restrictionStoreScreen);pageTitle.textContent=STORES[store];backButton.hidden=false;loadRestrictionsByStore(store);return;
  }

  if(hash==='#restrictions'){
    movingShoppingItem=null;currentStore=null;lockedAddStore=null;editingRestrictionOriginalName=null;restrictionFromMaster=false;showOnly(restrictionsScreen);pageTitle.textContent='Manage Restrictions';backButton.hidden=false;return;
  }

  if(hash==='#restriction/new'){
    movingShoppingItem=null;currentStore=null;lockedAddStore=null;editingRestrictionOriginalName=null;restrictionFromMaster=false;showOnly(restrictionEditScreen);pageTitle.textContent='Add Restriction';backButton.hidden=false;clearRestrictionForm();setTimeout(()=>restrictionItemName.focus(),80);return;
  }

  if(hash.startsWith('#restriction/edit/')){
    let name='';try{name=decodeURIComponent(hash.slice('#restriction/edit/'.length))}catch(_){goRestrictionReturn();return}
    movingShoppingItem=null;currentStore=null;lockedAddStore=null;restrictionFromMaster=false;showOnly(restrictionEditScreen);pageTitle.textContent='Edit Restriction';backButton.hidden=false;loadRestrictionForEdit(name);return;
  }

  movingShoppingItem=null;currentStore=null;lockedAddStore=null;editingRestrictionOriginalName=null;restrictionFromMaster=false;showOnly(homeScreen);pageTitle.textContent='Uno Club Shopping';backButton.hidden=true;loadHomeCounts();
}

backButton.addEventListener('click',()=>{
  const hash=location.hash;
  if(hash.startsWith('#shopping/move/')){if(movingShoppingItem&&STORES[movingShoppingItem.store])goStore(movingShoppingItem.store);else goHome();return}
  if(hash.startsWith('#add/')){const store=hash.slice(5);if(STORES[store]){goStore(store);return}}
  if(hash.startsWith('#inventory-add/')){const category=hash.slice('#inventory-add/'.length);if(INVENTORY_CATEGORIES[category]){goInventoryCategory(category);return}}
  if(hash.startsWith('#inventory/')){goInventory();return}
  if(hash==='#inventory'){goHome();return}
  if(hash==='#master/add'){goMasterList();return}
  if(hash.startsWith('#master/restriction/')){goMasterList();return}
  if(hash==='#master'){goAdmin();return}
  if(hash.startsWith('#restrictions/store/')){goRestrictionsByStore();return}
  if(hash==='#restrictions/items'||hash==='#restrictions/stores'){goRestrictions();return}
  if(hash==='#restrictions'){goAdmin();return}
  if(hash==='#admin'){goHome();return}
  if(hash==='#restriction/new'||hash.startsWith('#restriction/edit/')){goRestrictionReturn();return}
  goHome();
});

        if(result.reason==='protected_name'){showToast('Case of Water cannot be renamed.',true);return}
        if(result.reason==='not_found'){showToast('That Master List item no longer exists.',true);goMasterList();return}
        if(result.reason==='item_on_disallowed_store'){showToast(`${itemName} is currently on the ${STORES[result.existing_store]||'another store'} list. Keep that store allowed or remove the item from that shopping list first.`,true);return}
        if(result.reason==='invalid_name'){showToast('Please enter a valid item name.',true);return}
        showToast('Could not save the item.',true);return;
      }
      invalidateMasterItems();invalidateInventorySearch();goMasterList();setTimeout(()=>showToast(`${itemName} saved.`),80);return;
    }

    result=unwrapRpcResult(await api('/rest/v1/rpc/save_item_store_restriction',{method:'POST',body:JSON.stringify({p_original_item_name:editingRestrictionOriginalName,p_item_name:itemName,p_allowed_stores:allowedStores})}));
    if(result?.saved===false){
      if(result.reason==='restriction_exists'){showToast('A restriction for that item already exists.',true);return}
      if(result.reason==='item_on_disallowed_store'){showToast(`${itemName} is currently on the ${STORES[result.existing_store]||'another store'} list. Remove it from that list before applying this restriction.`,true);return}
      if(result.reason==='no_stores'){showToast('Choose at least one allowed store.',true);return}
      showToast('Could not save the restriction.',true);return;
    }
    invalidateMasterItems();goRestrictionReturn();setTimeout(()=>showToast(`${itemName} restriction saved.`),80);
  }catch(error){console.error(error);showToast(restrictionFromMaster?'Could not save the item.':'Could not save the restriction.',true)}finally{saveRestrictionButton.disabled=false;saveRestrictionButton.textContent=restrictionFromMaster?'Save Changes':'Save Restriction'}
});
deleteRestrictionButton.addEventListener('click',async()=>{
  if(!editingRestrictionOriginalName)return;const itemName=editingRestrictionOriginalName;if(!window.confirm(`Delete the restriction for ${itemName}?`))return;deleteRestrictionButton.disabled=true;deleteRestrictionButton.textContent='Deleting…';
  try{
    const result=unwrapRpcResult(await api('/rest/v1/rpc/delete_item_store_restriction',{method:'POST',body:JSON.stringify({p_item_name:itemName})}));if(!result||result.deleted!==true){showToast('Could not delete the restriction.',true);return}invalidateMasterItems();goRestrictionReturn();setTimeout(()=>showToast(`${itemName} restriction deleted.`),80);
  }catch(error){console.error(error);showToast('Could not delete the restriction.',true)}finally{deleteRestrictionButton.disabled=false;deleteRestrictionButton.textContent='Delete Restriction'}
});

window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;if(currentStore){loadStoreItems(true);return}if(currentInventoryCategory&&location.hash.startsWith('#inventory/')){loadInventoryItems(true);return}if(location.hash==='#inventory'){fetchInventorySearchItems(true).catch(error=>console.error(error));return}if(location.hash==='#master'){loadMasterList();return}if(location.hash==='#restrictions/items'){loadRestrictions();return}if(currentRestrictionStore&&location.hash.startsWith('#restrictions/store/')){loadRestrictionsByStore(currentRestrictionStore);return}if(location.hash==='#home')loadHomeCounts();
});
if(!location.hash)history.replaceState(null,'','#home');
route();
</script>
</body>
</html>
