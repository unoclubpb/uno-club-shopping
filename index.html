<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- APP VERSION: 1.0.4 -->
  <meta name="app-version" content="1.0.4">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Uno Shopping">

  <title>Uno Club Shopping</title>

  <link rel="icon" type="image/png" href="uno-club-shopping.PNG?v=1.0.4">
  <link rel="apple-touch-icon" href="uno-club-shopping.PNG?v=1.0.4">

  <style>
    :root {
      --black: #0b0b0b;
      --page: #f5f6f8;
      --white: #ffffff;
      --blue: #1e5acb;
      --blue-dark: #15459f;
      --blue-light: #79a5f4;
      --border: #d9d9d9;
      --text: #171717;
      --muted: #6b7280;
      --danger: #c62828;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .app-header {
      min-height: 82px;
      padding: calc(9px + env(safe-area-inset-top)) 14px 9px;
      background: var(--black);
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 10px rgba(0,0,0,.22);
    }

    .app-header h1 {
      flex: 1;
      margin: 0;
      text-align: left;
      white-space: pre-line;
      font-size: 23px;
      line-height: 1.02;
      font-weight: 850;
    }

    .header-logo {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.14),
        0 4px 12px rgba(0,0,0,.35);
    }

    .back-button {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--white);
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-button:active {
      background: rgba(255,255,255,.12);
    }

    main {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 22px 16px calc(34px + env(safe-area-inset-bottom));
    }

    .screen[hidden] {
      display: none !important;
    }

    .button-stack {
      display: grid;
      gap: 13px;
    }

    .main-button,
    .save-button {
      width: 100%;
      min-height: 62px;
      border: 0;
      border-radius: 14px;
      background: var(--blue);
      color: var(--white);
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 5px 14px rgba(30,90,203,.24);
      cursor: pointer;
      transition: transform .08s ease, background .15s ease;
    }

    .main-button:active,
    .save-button:active {
      transform: scale(.985);
      background: var(--blue-dark);
    }

    .main-button.add-item {
      background: var(--black);
      box-shadow: 0 5px 14px rgba(0,0,0,.20);
    }

    /* STORE BUTTON COUNTS */
    .store-button {
      position: relative;
    }

    .count-badge {
      position: absolute;
      top: 8px;
      right: 9px;
      min-width: 28px;
      height: 28px;
      padding: 0 7px;
      border-radius: 14px;
      background: var(--white);
      color: var(--blue);
      border: 2px solid rgba(255,255,255,.85);
      font-size: 15px;
      font-weight: 900;
      line-height: 24px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,.20);
      pointer-events: none;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .form-card {
      padding: 18px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 15px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 54px;
      padding: 12px 13px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      color: var(--text);
      font-size: 18px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(30,90,203,.12);
    }

    .hint {
      margin: -9px 0 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .list-card {
      padding: 0;
    }

    .list-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 84px 48px;
      gap: 10px;
      padding: 12px 14px;
      background: #edf3ff;
      border-bottom: 1px solid var(--border);
      color: #364152;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .list-heading span:nth-child(2) {
      text-align: center;
    }

    .item-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 84px 48px;
      gap: 10px;
      align-items: center;
      min-height: 66px;
      padding: 9px 14px;
      border-bottom: 1px solid #ececec;
    }

    .item-row:last-child {
      border-bottom: 0;
    }

    .item-name {
      min-width: 0;
      font-size: 17px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .qty-input,
    .qty-fixed {
      width: 76px;
      min-height: 44px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--white);
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }

    .qty-input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(30,90,203,.12);
    }

    .qty-fixed {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f3f6;
      color: #515865;
    }

    .delete-button {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 11px;
      background: #fff1f1;
      color: var(--danger);
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-button:active {
      background: #ffdede;
    }

    .delete-button:disabled {
      opacity: .45;
    }

    .permanent-row {
      background: #f7faff;
    }

    .fixed-note {
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-top: 3px;
    }

    .empty-state,
    .loading-state,
    .error-state {
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 16px;
    }

    .error-state {
      color: var(--danger);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translate(-50%, 18px);
      width: min(calc(100% - 32px), 520px);
      padding: 13px 16px;
      border-radius: 12px;
      background: var(--black);
      color: var(--white);
      text-align: center;
      font-weight: 700;
      box-shadow: 0 8px 30px rgba(0,0,0,.26);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.error {
      background: #8f1d1d;
    }

    @media (max-width: 390px) {
      .item-row,
      .list-heading {
        grid-template-columns: minmax(0, 1fr) 72px 44px;
        gap: 7px;
        padding-left: 11px;
        padding-right: 11px;
      }

      .qty-input,
      .qty-fixed {
        width: 66px;
      }
    }
  </style>
</head>

<body>

<header class="app-header">

  <button
    id="backButton"
    class="back-button"
    type="button"
    aria-label="Back to main page"
    hidden
  >
    &larr;
  </button>

  <h1 id="pageTitle">Uno Club
Shopping</h1>

  <img
    class="header-logo"
    src="uno-club-shopping.PNG?v=1.0.4"
    alt="Uno Club Shopping logo"
  >

</header>

<main>

  <!-- HOME PAGE -->
  <section id="homeScreen" class="screen">

    <div class="button-stack">

      <button
        id="addItemButton"
        class="main-button add-item"
        type="button"
      >
        Add Item
      </button>

      <button
        class="main-button store-button"
        type="button"
        data-store="sams_costco"
      >
        Sam’s/Costco
        <span
          class="count-badge"
          data-count-store="sams_costco"
        >1</span>
      </button>

      <button
        class="main-button store-button"
        type="button"
        data-store="walmart"
      >
        Walmart
        <span
          class="count-badge"
          data-count-store="walmart"
        >0</span>
      </button>

      <button
        class="main-button store-button"
        type="button"
        data-store="alcohol"
      >
        Alcohol
        <span
          class="count-badge"
          data-count-store="alcohol"
        >0</span>
      </button>

      <button
        class="main-button store-button"
        type="button"
        data-store="sodas"
      >
        Sodas
        <span
          class="count-badge"
          data-count-store="sodas"
        >0</span>
      </button>

    </div>

  </section>


  <!-- ADD ITEM PAGE -->
  <section id="addScreen" class="screen" hidden>

    <div class="card form-card">

      <form id="addItemForm">

        <div class="field">

          <label for="itemName">
            What item would you like to add?
          </label>

          <input
            id="itemName"
            name="itemName"
            type="text"
            maxlength="100"
            autocomplete="off"
            required
          >

        </div>

        <div class="field">

          <label for="quantity">
            Quantity
          </label>

          <input
            id="quantity"
            name="quantity"
            type="number"
            min="1"
            max="9999"
            step="1"
            inputmode="numeric"
            placeholder="1"
          >

        </div>

        <div class="hint">
          If left blank, the quantity will be 1.
        </div>

        <div class="field">

          <label for="store">
            Store
          </label>

          <select
            id="store"
            name="store"
            required
          >

            <option value="" selected disabled>
              Choose a store
            </option>

            <option value="sams_costco">
              Sam’s/Costco
            </option>

            <option value="walmart">
              Walmart
            </option>

            <option value="alcohol">
              Alcohol
            </option>

            <option value="sodas">
              Sodas
            </option>

          </select>

        </div>

        <button
          id="saveItemButton"
          class="save-button"
          type="submit"
        >
          Add Item
        </button>

      </form>

    </div>

  </section>


  <!-- STORE PAGE -->
  <section id="storeScreen" class="screen" hidden>

    <div class="card list-card">

      <div class="list-heading" aria-hidden="true">
        <span>Item</span>
        <span>Qty</span>
        <span></span>
      </div>

      <div
        id="storeList"
        aria-live="polite"
      ></div>

    </div>

  </section>

</main>


<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
></div>


<script>
'use strict';


/* =========================================================
   APP VERSION
   ========================================================= */

const APP_VERSION = '1.0.4';

console.info(`Uno Club Shopping v${APP_VERSION}`);


/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  'https://yfchkrnuxaquqzxtcynp.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_gh0acghIDuQDgh24ZIm8Mw_c1bpvIM6';


/* =========================================================
   STORES
   ========================================================= */

const STORES = {
  sams_costco: 'Sam’s/Costco',
  walmart: 'Walmart',
  alcohol: 'Alcohol',
  sodas: 'Sodas'
};


/* =========================================================
   ELEMENTS
   ========================================================= */

const homeScreen =
  document.getElementById('homeScreen');

const addScreen =
  document.getElementById('addScreen');

const storeScreen =
  document.getElementById('storeScreen');

const pageTitle =
  document.getElementById('pageTitle');

const backButton =
  document.getElementById('backButton');

const addItemButton =
  document.getElementById('addItemButton');

const addItemForm =
  document.getElementById('addItemForm');

const itemNameInput =
  document.getElementById('itemName');

const quantityInput =
  document.getElementById('quantity');

const storeSelect =
  document.getElementById('store');

const saveItemButton =
  document.getElementById('saveItemButton');

const storeList =
  document.getElementById('storeList');

const toast =
  document.getElementById('toast');


let currentStore = null;
let toastTimer = null;


/* =========================================================
   MESSAGE POPUP
   ========================================================= */

function showToast(message, isError = false) {

  clearTimeout(toastTimer);

  toast.textContent = message;

  toast.classList.toggle(
    'error',
    isError
  );

  toast.classList.add('show');

  toastTimer = setTimeout(
    () => toast.classList.remove('show'),
    2500
  );
}


/* =========================================================
   SUPABASE API
   ========================================================= */

async function api(path, options = {}) {

  const headers = {

    apikey:
      SUPABASE_PUBLISHABLE_KEY,

    Accept:
      'application/json',

    ...(options.body
      ? {
          'Content-Type':
            'application/json'
        }
      : {}),

    ...(options.headers || {})
  };


  const response =
    await fetch(
      SUPABASE_URL + path,
      {
        ...options,
        headers
      }
    );


  if (!response.ok) {

    let message =
      `Request failed (${response.status})`;

    try {

      const data =
        await response.json();

      message =
        data.message ||
        data.error_description ||
        data.hint ||
        message;

    } catch (_) {

      const text =
        await response.text();

      if (text) {
        message = text;
      }
    }

    throw new Error(message);
  }


  if (response.status === 204) {
    return null;
  }


  const text =
    await response.text();


  return text
    ? JSON.parse(text)
    : null;
}


/* =========================================================
   HOME PAGE ITEM COUNTS
   ========================================================= */

async function loadHomeCounts() {

  /*
    Sam’s/Costco begins at 1 because
    Case of Water is permanently on that list.
  */

  const counts = {
    sams_costco: 1,
    walmart: 0,
    alcohol: 0,
    sodas: 0
  };


  try {

    const data =
      await api(
        '/rest/v1/shopping_items?select=store'
      );


    if (Array.isArray(data)) {

      data.forEach(item => {

        if (
          Object.prototype.hasOwnProperty.call(
            counts,
            item.store
          )
        ) {

          counts[item.store]++;
        }

      });

    }


    document
      .querySelectorAll('.count-badge')
      .forEach(badge => {

        const store =
          badge.dataset.countStore;

        badge.textContent =
          counts[store] ?? 0;

      });


  } catch (error) {

    console.error(
      'Could not load store counts:',
      error
    );

  }
}


/* =========================================================
   NAVIGATION
   ========================================================= */

function showOnly(screen) {

  homeScreen.hidden =
    screen !== homeScreen;

  addScreen.hidden =
    screen !== addScreen;

  storeScreen.hidden =
    screen !== storeScreen;
}


function goHome() {
  location.hash = '#home';
}


function goAdd() {
  location.hash = '#add';
}


function goStore(storeKey) {
  location.hash =
    '#store/' + storeKey;
}


function route() {

  const hash =
    location.hash || '#home';


  if (hash === '#add') {

    currentStore = null;

    showOnly(addScreen);

    pageTitle.textContent =
      'Add Item';

    backButton.hidden =
      false;

    setTimeout(
      () => itemNameInput.focus(),
      80
    );

    return;
  }


  if (hash.startsWith('#store/')) {

    const storeKey =
      hash.slice('#store/'.length);


    if (!STORES[storeKey]) {

      goHome();

      return;
    }


    currentStore =
      storeKey;


    showOnly(storeScreen);


    pageTitle.textContent =
      STORES[storeKey];


    backButton.hidden =
      false;


    loadStoreItems();

    return;
  }


  currentStore = null;

  showOnly(homeScreen);

  pageTitle.textContent =
    'Uno Club\nShopping';

  backButton.hidden =
    true;

  loadHomeCounts();
}


/* =========================================================
   CLEAN ITEM NAME
   ========================================================= */

function normalizeItemName(value) {

  return value
    .trim()
    .replace(/\s+/g, ' ');
}


/* =========================================================
   MAIN BUTTONS
   ========================================================= */

addItemButton.addEventListener(
  'click',
  goAdd
);


document
  .querySelectorAll('.store-button')
  .forEach(button => {

    button.addEventListener(
      'click',
      () =>
        goStore(
          button.dataset.store
        )
    );

  });


backButton.addEventListener(
  'click',
  goHome
);


/* =========================================================
   ADD ITEM
   ========================================================= */

addItemForm.addEventListener(
  'submit',
  async event => {

    event.preventDefault();


    const itemName =
      normalizeItemName(
        itemNameInput.value
      );


    const store =
      storeSelect.value;


    const rawQuantity =
      quantityInput.value.trim();


    const quantity =
      rawQuantity === ''
        ? 1
        : Number.parseInt(
            rawQuantity,
            10
          );


    if (!itemName) {

      showToast(
        'Please enter an item.',
        true
      );

      itemNameInput.focus();

      return;
    }


    if (
      !store ||
      !STORES[store]
    ) {

      showToast(
        'Please choose a store.',
        true
      );

      storeSelect.focus();

      return;
    }


    if (
      !Number.isInteger(quantity) ||
      quantity < 1 ||
      quantity > 9999
    ) {

      showToast(
        'Quantity must be a whole number of 1 or more.',
        true
      );

      quantityInput.focus();

      return;
    }


    if (
      store === 'sams_costco' &&
      itemName.toLocaleLowerCase() ===
        'case of water'
    ) {

      showToast(
        'Case of Water is already permanently on Sam’s/Costco.',
        true
      );

      return;
    }


    saveItemButton.disabled =
      true;

    saveItemButton.textContent =
      'Adding…';


    try {

      await api(
        '/rest/v1/shopping_items',
        {
          method: 'POST',

          headers: {
            Prefer:
              'return=minimal'
          },

          body:
            JSON.stringify({
              item_name:
                itemName,

              quantity:
                quantity,

              store:
                store
            })
        }
      );


      itemNameInput.value =
        '';

      quantityInput.value =
        '';


      showToast(
        `Added to ${STORES[store]}.`
      );


      /*
        Update the hidden home-page counts
        immediately after adding.
      */
      loadHomeCounts();


      itemNameInput.focus();


    } catch (error) {

      console.error(error);


      showToast(
        'Could not add the item. Please try again.',
        true
      );


    } finally {

      saveItemButton.disabled =
        false;

      saveItemButton.textContent =
        'Add Item';
    }

  }
);


/* =========================================================
   LOAD STORE LIST
   ========================================================= */

async function loadStoreItems(
  quiet = false
) {

  if (!currentStore) {
    return;
  }


  const storeAtStart =
    currentStore;


  if (!quiet) {

    storeList.innerHTML =
      '<div class="loading-state">Loading…</div>';
  }


  try {

    const data =
      await api(

        '/rest/v1/shopping_items' +

        '?select=id,item_name,quantity,store' +

        '&store=eq.' +

        encodeURIComponent(
          storeAtStart
        )
      );


    if (
      currentStore !==
      storeAtStart
    ) {
      return;
    }


    const items =
      Array.isArray(data)
        ? data
        : [];


    items.sort(
      (a, b) =>
        a.item_name.localeCompare(
          b.item_name,
          undefined,
          {
            sensitivity: 'base',
            numeric: true
          }
        )
    );


    renderStoreList(items);


  } catch (error) {

    console.error(error);


    if (
      !quiet &&
      currentStore ===
        storeAtStart
    ) {

      storeList.innerHTML =
        '<div class="error-state">Could not load this list. Please try again.</div>';
    }

  }
}


/* =========================================================
   DISPLAY STORE LIST
   ========================================================= */

function renderStoreList(items) {

  storeList.innerHTML =
    '';


  if (
    currentStore ===
    'sams_costco'
  ) {

    storeList.appendChild(
      createPermanentWaterRow()
    );
  }


  items.forEach(
    item =>
      storeList.appendChild(
        createItemRow(item)
      )
  );


  if (
    items.length === 0
  ) {

    const empty =
      document.createElement(
        'div'
      );


    empty.className =
      'empty-state';


    empty.textContent =
      currentStore ===
        'sams_costco'

        ? 'No other items on this list.'

        : 'No items on this list.';


    storeList.appendChild(
      empty
    );
  }
}


/* =========================================================
   PERMANENT CASE OF WATER
   ========================================================= */

function createPermanentWaterRow() {

  const row =
    document.createElement(
      'div'
    );


  row.className =
    'item-row permanent-row';


  const nameWrap =
    document.createElement(
      'div'
    );


  const name =
    document.createElement(
      'div'
    );


  name.className =
    'item-name';


  name.textContent =
    'Case of Water';


  const note =
    document.createElement(
      'div'
    );


  note.className =
    'fixed-note';


  note.textContent =
    'Always on list';


  nameWrap.append(
    name,
    note
  );


  const qty =
    document.createElement(
      'div'
    );


  qty.className =
    'qty-fixed';


  qty.textContent =
    '1';


  qty.setAttribute(
    'aria-label',
    'Quantity 1'
  );


  const spacer =
    document.createElement(
      'div'
    );


  spacer.setAttribute(
    'aria-hidden',
    'true'
  );


  row.append(
    nameWrap,
    qty,
    spacer
  );


  return row;
}


/* =========================================================
   NORMAL ITEM ROW
   ========================================================= */

function createItemRow(item) {

  const row =
    document.createElement(
      'div'
    );


  row.className =
    'item-row db-row';


  row.dataset.id =
    item.id;


  const name =
    document.createElement(
      'div'
    );


  name.className =
    'item-name';


  name.textContent =
    item.item_name;


  const qty =
    document.createElement(
      'input'
    );


  qty.className =
    'qty-input';


  qty.type =
    'number';


  qty.min =
    '1';


  qty.max =
    '9999';


  qty.step =
    '1';


  qty.inputMode =
    'numeric';


  qty.value =
    item.quantity;


  qty.setAttribute(
    'aria-label',
    `Quantity for ${item.item_name}`
  );


  qty.dataset.savedValue =
    String(item.quantity);


  qty.addEventListener(
    'focus',
    () => qty.select()
  );


  qty.addEventListener(
    'change',
    () =>
      updateQuantity(
        item.id,
        qty
      )
  );


  const del =
    document.createElement(
      'button'
    );


  del.type =
    'button';


  del.className =
    'delete-button';


  del.textContent =
    '×';


  del.setAttribute(
    'aria-label',
    `Delete ${item.item_name}`
  );


  del.addEventListener(
    'click',
    () =>
      deleteItem(
        item.id,
        item.item_name,
        row,
        del
      )
  );


  row.append(
    name,
    qty,
    del
  );


  return row;
}


/* =========================================================
   UPDATE QUANTITY
   ========================================================= */

async function updateQuantity(
  id,
  input
) {

  const oldValue =
    Number.parseInt(
      input.dataset.savedValue,
      10
    );


  const newValue =
    Number.parseInt(
      input.value,
      10
    );


  if (
    !Number.isInteger(newValue) ||
    newValue < 1 ||
    newValue > 9999
  ) {

    input.value =
      oldValue;


    showToast(
      'Quantity must be a whole number of 1 or more.',
      true
    );


    return;
  }


  if (
    newValue === oldValue
  ) {
    return;
  }


  input.disabled =
    true;


  try {

    await api(

      '/rest/v1/shopping_items?id=eq.' +
      encodeURIComponent(id),

      {
        method:
          'PATCH',

        headers: {
          Prefer:
            'return=minimal'
        },

        body:
          JSON.stringify({
            quantity:
              newValue
          })
      }
    );


    input.dataset.savedValue =
      String(newValue);


    showToast(
      'Quantity updated.'
    );


  } catch (error) {

    console.error(error);


    input.value =
      oldValue;


    showToast(
      'Could not update the quantity.',
      true
    );


  } finally {

    input.disabled =
      false;
  }
}


/* =========================================================
   DELETE ITEM
   ========================================================= */

async function deleteItem(
  id,
  itemName,
  row,
  button
) {

  button.disabled =
    true;


  try {

    await api(

      '/rest/v1/shopping_items?id=eq.' +
      encodeURIComponent(id),

      {
        method:
          'DELETE',

        headers: {
          Prefer:
            'return=minimal'
        }
      }
    );


    row.remove();


    showToast(
      `${itemName} removed.`
    );


    /*
      Refresh counts after deletion.
    */
    loadHomeCounts();


    if (
      !storeList.querySelector(
        '.db-row'
      )
    ) {

      const empty =
        document.createElement(
          'div'
        );


      empty.className =
        'empty-state';


      empty.textContent =
        currentStore ===
          'sams_costco'

          ? 'No other items on this list.'

          : 'No items on this list.';


      storeList.appendChild(
        empty
      );
    }


  } catch (error) {

    console.error(error);


    button.disabled =
      false;


    showToast(
      'Could not remove the item.',
      true
    );
  }
}


/* =========================================================
   PAGE EVENTS
   ========================================================= */

window.addEventListener(
  'hashchange',
  route
);


document.addEventListener(
  'visibilitychange',
  () => {

    if (document.hidden) {
      return;
    }


    /*
      Refresh whichever data is relevant
      whenever the app becomes active again.
    */

    if (currentStore) {

      loadStoreItems(true);

    } else {

      loadHomeCounts();

    }

  }
);


/* =========================================================
   START APP
   ========================================================= */

if (!location.hash) {

  history.replaceState(
    null,
    '',
    '#home'
  );
}


route();

</script>

</body>
</html>
